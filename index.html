    --page:#faf9f6; --surface:#ffffff; --surface-2:#f4f2ec; --text:#2a2721; --muted:#7a7568; --muted-2:#98937f;
    --line:#ece9e1; --line-soft:#f3f1ea; --line-strong:#dcd8cd;
    --tile-bg:#f4f2ec; --tile-ic:#5c6b34;
    --brand:#8a9a5b; --brand-2:#7d8c50; --brand-deep:#5c6b34; --brand-ink:#414c24;
    --tint:#eef1e5; --tint-2:#e3e8d3;
    --primary:#4d5a2c; --primary-tx:#f7f9ef;
    --ring:rgba(138,154,91,.18);
    --shadow:0 1px 2px rgba(42,39,33,.04);
    --shadow-hover:0 2px 6px rgba(42,39,33,.07),0 10px 24px rgba(42,39,33,.09);
    --col-bg:#f2f0e9;
    --todo-bg:#eceff4; --todo-tx:#5a6473; --todo-dot:#8994a5;
    --doing-bg:#f7ecd8; --doing-tx:#8a6520; --doing-dot:#d3a049;
    --done-bg:#e7ecd9; --done-tx:#57682f; --done-dot:#8a9a5b;
    --done-card:#f7f8f1; --flag-tx:#313b18;
    --danger:#c0685b; --danger-bg:#f8ede9;
    --hdr:linear-gradient(120deg,#eef1e5 0%,#e3e8d3 100%);
    --hdr-word:#4d5a2c;
  }
  /* "רך" — מדרגה בין הבהיר לבינוני. עדיין תצוגה בהירה, אבל בלי הלבן הצורב:
     הרקע יורד לבז' חמים והמשטחים אליו, כך שהניגודיות מתרככת בלי להתהפך. */
  :root[data-theme="soft"]{
    --page:#efece2; --surface:#f9f8f3; --surface-2:#e8e4d8; --text:#2a2721; --muted:#736e60; --muted-2:#8f8a76;
    --line:#e0dbcc; --line-soft:#e8e4d8; --line-strong:#cfc9b7;
    --tile-bg:#e8e4d8; --tile-ic:#5c6b34;
    --brand:#8a9a5b; --brand-2:#7d8c50; --brand-deep:#556230; --brand-ink:#3d4823;
    --tint:#e6ebd7; --tint-2:#dae0c5;
    --primary:#4d5a2c; --primary-tx:#f7f9ef;
    --ring:rgba(138,154,91,.2);
    --shadow:0 1px 2px rgba(42,39,33,.05);
    --shadow-hover:0 2px 6px rgba(42,39,33,.09),0 10px 24px rgba(42,39,33,.11);
    --col-bg:#e8e4d8;
    --todo-bg:#e3e7ee; --todo-tx:#4f596a; --todo-dot:#8290a2;
    --doing-bg:#f0e3cb; --doing-tx:#7d5c1d; --doing-dot:#c6953f;
    --done-bg:#dee5cd; --done-tx:#4f5f2b; --done-dot:#7f8f52;
    --done-card:#eef0e4; --flag-tx:#313b18;
    --danger:#b6614f; --danger-bg:#f2e4de;
    --hdr:linear-gradient(120deg,#e6ebd7 0%,#dae0c5 100%);
    --hdr-word:#4d5a2c;
  }
  :root[data-theme="mid"]{
    --page:#2a2823; --surface:#33312b; --surface-2:#3a3830; --text:#eae7dd; --muted:#a5a094; --muted-2:#7d7a6f;
    --line:#403e35; --line-soft:#3a3830; --line-strong:#4d4a3f;
    --tile-bg:#3a3830; --tile-ic:#b3c07e;
    --brand:#a8b876; --brand-2:#98a866; --brand-deep:#bccb8c; --brand-ink:#cfdba6;
    --tint:#383a2a; --tint-2:#414430;
    --primary:#a8b876; --primary-tx:#26290f;
    --ring:rgba(168,184,118,.22);
    --shadow:0 1px 2px rgba(0,0,0,.18);
    --shadow-hover:0 2px 6px rgba(0,0,0,.3),0 12px 26px rgba(0,0,0,.34);
    --col-bg:#2f2d27;
    --todo-bg:#31363f; --todo-tx:#b4bcc9; --todo-dot:#8792a1;
    --doing-bg:#3e3524; --doing-tx:#e2bb77; --doing-dot:#cfa055;
    --done-bg:#39412a; --done-tx:#bccb8c; --done-dot:#93a35f;
    --done-card:#343228; --flag-tx:#20240f;
    --danger:#d99286; --danger-bg:#3b2723;
    --hdr:linear-gradient(120deg,#383a2a 0%,#414430 100%);
    --hdr-word:#cfdba6;
  }
  :root[data-theme="dark"]{
    --page:#1a1915; --surface:#22211c; --surface-2:#292822; --text:#eceadf; --muted:#9d998e; --muted-2:#726f66;
    --line:#302e27; --line-soft:#292822; --line-strong:#3e3b32;
    --tile-bg:#292822; --tile-ic:#b3c07e;
    --brand:#a8b876; --brand-2:#98a866; --brand-deep:#bccb8c; --brand-ink:#cfdba6;
    --tint:#2a2c1f; --tint-2:#333624;
    --primary:#a8b876; --primary-tx:#1c1f0b;
    --ring:rgba(168,184,118,.22);
    --shadow:0 1px 2px rgba(0,0,0,.25);
    --shadow-hover:0 2px 6px rgba(0,0,0,.42),0 14px 30px rgba(0,0,0,.48);
    --col-bg:#201f19;
    --todo-bg:#2a2e37; --todo-tx:#adb5c2; --todo-dot:#7f8a99;
    --doing-bg:#352d1e; --doing-tx:#dfb771; --doing-dot:#c99b45;
    --done-bg:#2f3623; --done-tx:#b3c07e; --done-dot:#8a9a5b;
    --done-card:#252419; --flag-tx:#161a08;
    --danger:#d28c80; --danger-bg:#2e201d;
    --hdr:linear-gradient(120deg,#2a2c1f 0%,#333624 100%);
    --hdr-word:#cfdba6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  /* both-edges שומר מקום לפס גלילה בשני הצדדים — בלעדיו התוכן "קופץ"
     הצידה בין עמוד שנגלל לעמוד שלא, והלוח לא יושב באמת במרכז המסך */
  html{scrollbar-gutter:stable both-edges}
  html,body{margin:0; padding:0}
  body{
    font-family:system-ui,-apple-system,'Segoe UI','Rubik',Arial,sans-serif;
    background:var(--page); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased;
    transition:background .2s ease, color .2s ease;
  }
  #root{max-width:1160px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column}
  svg{display:block}
  button{font-family:inherit}

  /* ---------- Header (גרדיאנט רך) ---------- */
  /* הכותרת נגללת החוצה ובמקומה נדבקות הלשוניות (ראו .tabs). להדביק את שתיהן
     היה אוכל ~160px קבועים מהמסך בנייד — והמידע שחשוב בגלילה הוא באיזו
     קטגוריה אני נמצא, לא הלוגו. */
  header{position:relative; z-index:20; background:var(--hdr); border-bottom:1px solid var(--line-strong);
    padding:6px 16px; padding-top:calc(6px + env(safe-area-inset-top)); overflow:visible}
  .head-in{display:flex; align-items:center; gap:11px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; min-width:0}
  /* הבאנר צומצם כדי לפנות גובה מסך ללו"ז הרחב — שם כל שורה נחשבת */
  .brand .logo-img{height:86px; width:auto; display:block; margin:-6px 0; filter:drop-shadow(0 4px 7px rgba(40,50,10,.22))}
  @media (max-width:520px){ .brand .logo-img{height:80px} }
  .live{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--brand-deep);
    background:var(--surface); padding:4px 10px; border-radius:999px; box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .live .dot{width:7px; height:7px; border-radius:50%; background:var(--done-dot)}
  .live .dot.off{background:var(--doing-dot)}
  .head-right{margin-inline-start:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .stat{display:flex; align-items:center; gap:5px; background:var(--surface); border-radius:9px; padding:5px 10px;
    font-size:12px; color:var(--muted); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .stat b{font-size:14px; font-weight:800; color:var(--brand-deep)}
  /* theme switch */
  .theme{display:flex; background:var(--surface); border-radius:10px; padding:3px; gap:2px; box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .theme button{border:none; background:transparent; color:var(--muted); width:30px; height:28px; border-radius:7px;
    cursor:pointer; display:flex; align-items:center; justify-content:center}
  .theme button.on{background:var(--tint); color:var(--brand-deep)}

  /* ---------- Filters ---------- */
  .filters{display:flex; flex-wrap:wrap; gap:7px; padding:14px 16px 4px; align-items:center}
  .chip{display:flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); border-radius:999px; padding:6px 12px; font-size:13.5px; cursor:pointer;
    white-space:nowrap; transition:.13s; font-weight:600}
  .chip:hover{border-color:var(--line-strong); color:var(--text)}
  .chip.active{color:#fff; border-color:transparent}
  .chip .cico{display:flex; align-items:center; flex:0 0 auto; margin-inline-start:-2px}
  .chip .cnt{background:var(--tile-bg); color:var(--muted); border-radius:999px; padding:0 6px; font-size:11px; font-weight:700}
  .chip.active .cnt{background:rgba(255,255,255,.25); color:#fff}
  .chip-edit{margin-inline-start:2px; border-style:dashed; color:var(--muted)}

  /* ---------- לשוניות חוצץ (לו"ז / משימות / קניות) ---------- */
  /* לשונית אחת פעילה בכל רגע. הפעילה "שוברת" את הקו התחתון ונדבקת לתוכן
     שמתחתיה — זה מה שנותן את התחושה של חוצץ ולא של כפתורים. */
  /* נדבקות לראש המסך בגלילה, כדי שתמיד יהיה ברור באיזו קטגוריה אני נמצא.
     רקע אטום חובה — אחרת התוכן נגלל מתחתן ונראה דרכן. */
  /* במחשב: הלוגו, הפס הירוק והלשוניות נשארים על המסך גם בגלילה.
     בנייד ה-topbar נשאר זורם — שם רק הלשוניות נעוצות, אחרת הלוגו היה
     גוזל כ-160 פיקסלים קבועים ממסך הטלפון. */
  @media (min-width:901px){
    .topbar{position:sticky; top:0; z-index:30; background:var(--page)}
  }
  .tabs{position:sticky; top:0; z-index:25; background:var(--page);
    display:flex; gap:4px; align-items:flex-end; padding:14px 16px 0;
    border-bottom:1px solid var(--line-strong); overflow-x:auto; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  /* לחיצה כפולה על לשונית סימנה את הטקסט שבתוכה, והסמן המהבהב שנשאר שם
     נראה כאילו אפשר לערוך את שם הלשונית. כותרות וכפתורים אינם טקסט
     לעריכה — מכבים בהם סימון טקסט לגמרי. */
  .tabs, .tabs *, header, header *, .rail, .rail *{
    -webkit-user-select:none; user-select:none; caret-color:transparent}
  /* overflow:hidden גוזר את פס הצבע לצורת הלשונית בדיוק — בלעדיו הפינות
     שלו בולטות מעבר לרדיוס של המסגרת בפיקסל-שניים */
  .tab{position:relative; overflow:hidden; display:flex; align-items:center; gap:10px; flex:0 0 auto;
    border:1px solid transparent; border-bottom:none; background:transparent; color:var(--muted);
    border-radius:16px 16px 0 0; padding:11px 20px 12px; margin-bottom:-1px;
    font-family:inherit; font-size:15.5px; font-weight:700; cursor:pointer; white-space:nowrap;
    transition:color .13s, background .13s}
  .tab:hover{color:var(--text)}
  .tab.on{background:var(--page); color:var(--text); border-color:var(--line-strong)}
  /* פס בצבע הקטגוריה על גב הלשונית הפעילה.
     inset-inline:0 ו-top:0 ולא -1px: המיקום נמדד מתיבת הריפוד, כלומר *בתוך*
     המסגרת — כך הפס לא חורג מגבולות הלשונית. עבה יותר במקום רחב יותר. */
  .tab.on::before{content:''; position:absolute; inset-inline:0; top:0; height:5px;
    background:var(--acc); border-radius:15px 15px 0 0}
  .tab .cnt{background:var(--tile-bg); color:var(--muted); border-radius:999px; padding:1px 9px;
    font-size:12.5px; font-weight:700}
  .tab.on .cnt{background:color-mix(in srgb, var(--acc) 18%, var(--surface)); color:var(--acc)}
  /* בנייד שלוש הלשוניות חייבות להיכנס למסך אחד. flex:1 מחלק את הרוחב שווה
     בשווה במקום לגלוש שמאלה ולהיחתך. */
  @media (max-width:900px){
    .tabs{padding:12px 10px 0; gap:3px; overflow-x:visible}
    .tab{flex:1 1 0; min-width:0; justify-content:center; padding:10px 6px 11px; font-size:14px; gap:6px}
    .tab .cnt{font-size:11.5px; padding:1px 7px}
  }
  @media (max-width:380px){
    .tab{font-size:13px; gap:5px; padding:10px 4px 11px}
  }
  /* שורת התיוגים — קטנה ועדינה יותר מהסננים הראשיים */
  .filters.tagrow{padding:6px 16px 2px; gap:6px}
  .tchipf{display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); border-radius:999px; padding:4px 10px; font-size:12.5px; font-weight:600;
    cursor:pointer; white-space:nowrap; transition:.13s}
  .tchipf:hover{border-color:var(--line-strong); color:var(--text)}
  .tchipf.on{color:#fff; border-color:transparent}
  .tchipf .cnt{background:var(--tile-bg); color:var(--muted); border-radius:999px; padding:0 5px; font-size:10.5px; font-weight:700}
  .tchipf.on .cnt{background:rgba(255,255,255,.25); color:#fff}
  .tchipf.edit{border-style:dashed; padding:4px 8px}
  .tchipf .cico{display:flex; align-items:center}
  .tagsep{width:1px; align-self:stretch; background:var(--line); margin:2px 3px; flex:0 0 auto}

  /* בורר היומן בתוך פאנל הלו"ז */
  .calf{display:flex; gap:5px; padding:8px 12px 2px; flex-wrap:wrap}
  .calf-b{border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:999px;
    padding:3px 10px; font-size:11.5px; font-weight:700; cursor:pointer; transition:.13s}
  .calf-b:hover{border-color:var(--line-strong); color:var(--text)}
  .calf-b.on{background:var(--tint); color:var(--brand-deep); border-color:var(--brand)}
  /* אירוע מיומן Google — נבדל בעדינות מתזכורת של הלוח */
  .ev-cal .ev-when{background:var(--tile-bg); color:var(--muted)}

  /* ---------- תצוגת יומן מלאה ---------- */
  .calnav{margin-inline-start:auto; display:flex; align-items:center; gap:4px}
  .cnb{width:26px; height:26px; border-radius:7px; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
    font-size:14px; font-weight:700; line-height:1}
  .cnb:hover{border-color:var(--line-strong); color:var(--text)}
  .cnb.today{width:auto; padding:0 9px; font-size:11.5px}
  .crng{font-size:12px; color:var(--muted); font-weight:700; padding:0 6px; white-space:nowrap}
  .calmodes{display:flex; gap:4px; padding:9px 12px 0}
  .cmb{border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:8px;
    padding:4px 12px; font-size:12.5px; font-weight:700; cursor:pointer}
  .cmb:hover{border-color:var(--line-strong); color:var(--text)}
  .cmb.on{background:var(--primary); color:var(--primary-tx); border-color:transparent}
  .calf .csw{width:7px; height:7px; border-radius:50%; flex:0 0 auto}
  /* בלו"ז הרחב שלוש שורות הכלים (כותרת / תצוגה / יומנים) התכווצו לשורה אחת,
     כמו סרגל הכלים ביומן גוגל. זה החזיר ~70px של גובה לרשת עצמה. */
  .calpanel .panel-head{flex-wrap:wrap}
  .hd-modes,.hd-cals{display:flex; align-items:center; gap:5px; flex-wrap:wrap}
  .hd-modes{margin-inline-start:4px}
  .hd-cals{margin-inline-start:8px; padding-inline-start:10px; border-inline-start:1px solid var(--line)}
  .hd-modes .cmb{padding:3px 11px}
  /* הרשת נקצבת לגובה שנשאר על המסך, כדי שהתחתית שלה לא תיעלם
     מתחת לשורת ההוספה הצפה. :not(.compact) — רק בתצוגה המלאה. */
  .layout.is-wide .calpanel:not(.compact) .weekscroll{max-height:calc(100vh - 250px); overflow-y:auto}
  .calhint{display:flex; align-items:center; justify-content:center; gap:7px; width:100%;
    border:none; border-top:1px solid var(--line-soft); background:transparent; color:var(--muted);
    font-family:inherit; font-size:12px; font-weight:600; padding:9px 12px; cursor:pointer}
  .calhint:hover{background:var(--surface-2); color:var(--brand-deep)}

  /* רשת שעות */
  .weekscroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
  .week{display:grid}
  .wh{position:sticky; top:0; z-index:2; background:var(--surface); border-bottom:1px solid var(--line);
    padding:7px 4px 8px; text-align:center}
  .wh .dow{font-size:11px; color:var(--muted); font-weight:700}
  .wh .num{font-size:16px; font-weight:800; margin-top:1px; font-variant-numeric:tabular-nums}
  .wh .heb{font-size:9.5px; color:var(--muted-2); margin-top:1px}
  .wh.today .num{background:var(--brand-deep); color:var(--tint); border-radius:50%;
    width:25px; height:25px; line-height:25px; margin:1px auto 0; font-size:14px}
  .wh.corner{border-inline-end:1px solid var(--line-soft)}
  .allday-lbl{border-bottom:1px solid var(--line); border-inline-end:1px solid var(--line-soft);
    font-size:9.5px; color:var(--muted-2); text-align:center; padding-top:6px; font-weight:700}
  .allday-cell{border-bottom:1px solid var(--line); border-inline-end:1px solid var(--line-soft); min-height:22px}
  .gutter{border-inline-end:1px solid var(--line-soft)}
  .hr-lbl{height:34px; font-size:10.5px; color:var(--muted-2); text-align:center;
    font-variant-numeric:tabular-nums; padding-top:1px; font-weight:600}
  .daycol{position:relative; border-inline-end:1px solid var(--line-soft)}
  .daycol:last-child{border-inline-end:none}
  /* שישי ושבת מסומנים בגוון עדין בלבד. קודם הם קיבלו את surface-2 המלא,
     שנראה כמו עמודה "כבויה" — ואירועים בהם נראו כאילו הם לא שם. */
  .daycol.weekend{background:color-mix(in srgb, var(--tint) 42%, transparent)}
  .hr-line{height:34px; border-bottom:1px solid var(--line-soft)}
  /* עמודת flex ולא זרימה רגילה: כשהכותרת ארוכה היא זו שנחתכת, והשעה —
     שורת המידע שבלעדיה האירוע חסר משמעות — נשארת תמיד גלויה */
  .wev{position:absolute; inset-inline:3px; border-radius:7px; padding:3px 6px; font-size:10.5px;
    line-height:1.25; overflow:hidden; border-inline-start:3px solid var(--own); color:var(--text);
    background:color-mix(in srgb, var(--own) 16%, var(--surface)); cursor:default;
    display:flex; flex-direction:column}
  .wev b{display:block; font-weight:700; flex:0 1 auto; min-height:0; overflow:hidden}
  .wev span{color:var(--muted); font-variant-numeric:tabular-nums; flex:0 0 auto}
  /* אירוע קצר (תזכורת של 45 דקות ⇐ 26px) פשוט לא מכיל שתי שורות, והשעה
     נחתכה בתחתית התיבה. כאן הכותרת והשעה יושבות בשורה אחת, כמו ביומן גוגל. */
  .wev.tiny{flex-direction:row; align-items:baseline; gap:5px; padding:2px 6px; white-space:nowrap}
  .wev.tiny b{flex:0 1 auto; text-overflow:ellipsis}
  .wev.chip{position:static; margin:4px 3px; padding:3px 7px; font-weight:700}
  .nowline{position:absolute; inset-inline:0; height:2px; background:var(--danger); z-index:1}
  /* הנקודה נשארת בתוך העמודה (ולא -3px החוצה): בעמודה האחרונה היא הייתה
     בולטת מהמסגרת ופותחת פס גלילה אופקי מיותר של 3 פיקסלים */
  .nowline::before{content:''; position:absolute; inset-inline-end:0; top:-3px; width:8px; height:8px;
    border-radius:50%; background:var(--danger)}

  /* אג׳נדה */
  .agenda{padding:4px 0 8px}
  .aday{display:grid; grid-template-columns:58px 1fr; border-top:1px solid var(--line-soft)}
  .aday:first-child{border-top:none}
  .arail{padding:12px 0; text-align:center}
  .arail .dow{font-size:10.5px; color:var(--muted); font-weight:700}
  .arail .num{font-size:19px; font-weight:800; line-height:1.15; font-variant-numeric:tabular-nums}
  .arail .heb{font-size:9.5px; color:var(--muted-2)}
  .aday.today .arail .num{background:var(--brand-deep); color:var(--tint); border-radius:50%;
    width:29px; height:29px; line-height:29px; margin:1px auto}
  .arows{padding:7px 12px 10px 4px; display:flex; flex-direction:column; gap:5px; min-width:0}
  .arow{display:flex; align-items:flex-start; gap:9px; padding:7px 9px; border-radius:9px;
    background:color-mix(in srgb, var(--own) 9%, var(--surface)); border-inline-start:3px solid var(--own)}
  .arow .tm{flex:0 0 auto; width:46px; font-size:11.5px; font-weight:800; color:var(--muted);
    font-variant-numeric:tabular-nums; padding-top:1px}
  .arow .bd{flex:1; min-width:0}
  .arow .ti{font-size:13.5px; font-weight:600; word-break:break-word}
  .arow .mt{margin-top:3px; display:flex; flex-wrap:wrap; gap:5px; font-size:11px; color:var(--muted)}
  /* תווית שורה אחת עם קיצור. גלולה (999px) הפכה תיאור יומן ארוך שנשבר
     לשתי שורות ל"בועה" עגומה — רדיוס קטן + nowrap פותר את זה בשורש. */
  .mtag{background:var(--tile-bg); border-radius:7px; padding:2px 8px; font-weight:600;
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .mtag.rem{background:var(--tint); color:var(--brand-ink)}
  .ax{flex:0 0 auto; width:24px; height:24px; border-radius:6px; border:none; background:transparent;
    color:var(--muted-2); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0}
  .ax:hover{background:var(--danger-bg); color:var(--danger)}
  @media (max-width:900px){
    .aday{grid-template-columns:50px 1fr}
    .arow .ti{font-size:15px}
    .ax{width:32px; height:32px}
  }

  /* הסרה מהלו"ז */
  .ev-x{flex:0 0 auto; width:26px; height:26px; border-radius:8px; border:none; background:transparent;
    color:var(--muted-2); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0}
  .ev-x:hover{background:var(--danger-bg); color:var(--danger)}

  /* ---------- לו"ז יומי בפאנל הצד ---------- */
  /* רשת של יום אחד בעמודה צרה — גובה קצוב וגלילה פנימית, כדי שהיא לא
     תדחוף את המשימות אל מחוץ למסך (במיוחד בנייד, שם הפאנל עולה לראש) */
  .calpanel.compact .weekscroll{max-height:392px; overflow-y:auto}
  .calpanel.compact .agenda{max-height:560px; overflow-y:auto}
  .calpanel.compact .wh{padding:6px 4px 7px}
  .calpanel.compact .panel-head{padding:10px 12px}
  .calpanel.compact .arows{padding:6px 10px 9px 4px}
  .calpanel.compact .aday{grid-template-columns:48px 1fr}
  .calpanel.compact .arow .ti{font-size:13px}
  /* בנייד הלו"ז יושב מעל המשימות — נמוך יותר, כדי שהמשימות עדיין יציצו */
  @media (max-width:900px){
    .calpanel.compact .weekscroll{max-height:320px}
    .calpanel.compact .agenda{max-height:340px}
  }
  /* בלשונית הלו"ז בנייד: יום למעלה, אג׳נדה מתחתיו. האג׳נדה היא התוכן
     הראשי שם, ולכן היא זורמת עם העמוד ולא גוללת בתוך עצמה */
  .calstack{display:flex; flex-direction:column; gap:12px}
  .calstack .calpanel.compact .agenda{max-height:none; overflow:visible}
  /* בורר היומנים מופיע פעם אחת, בפאנל העליון */
  .calstack .calpanel + .calpanel .calf{display:none}

  /* ---------- מסילת התיוגים (בסגנון Google Keep) ---------- */
  /* רשימה אנכית בקצה הפנימי של המסך, לא עוד שורת צ'יפים שמתחרה בלשוניות */
  .rail{display:flex; flex-direction:column; gap:1px; align-content:start; padding-top:6px}
  .rail h4{margin:0 0 6px; padding-inline-start:15px; font-size:11px; font-weight:800;
    color:var(--muted-2); letter-spacing:.5px; display:flex; align-items:center; gap:6px}
  .rail h4 .g{margin-inline-start:auto; margin-inline-end:6px; width:24px; height:24px; border:none;
    background:transparent; color:var(--muted-2); border-radius:6px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0}
  .rail h4 .g:hover{background:var(--tile-bg); color:var(--text)}
  /* white-space:nowrap כאן הוא הגנה ולא עיצוב: צ'יפ עם radius של 999px
     שנשבר לשתי שורות מצטייר כביצה גדולה במקום כגלולה. */
  .rail-b{display:flex; align-items:center; gap:11px; width:100%; text-align:start;
    border:none; background:transparent; color:var(--text); border-radius:999px;
    padding:9px 15px; font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
    white-space:nowrap; transition:background .12s}
  .rail-b:hover{background:var(--surface-2)}
  .rail-b.on{background:var(--tint); color:var(--brand-ink); font-weight:800}
  .rail-b .ri{flex:0 0 auto; display:flex; align-items:center; width:18px}
  .rail-b .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .rail-b .cnt{flex:0 0 auto; font-size:11.5px; font-weight:700; color:var(--muted-2);
    font-variant-numeric:tabular-nums}
  .rail-b.on .cnt{color:inherit; opacity:.72; background:transparent}
  .rail .sep{height:1px; background:var(--line-soft); margin:7px 15px}
  .rail .clr{margin:8px 15px 0; border:1px dashed var(--line-strong); background:transparent;
    color:var(--muted); border-radius:999px; padding:6px 12px; font-family:inherit; font-size:12px;
    font-weight:700; cursor:pointer}
  .rail .clr:hover{color:var(--text); border-color:var(--muted-2)}
  /* בנייד המסילה נפרשת לשורת צ'יפים אופקית, צמוד מעל הרשימה שהיא מסננת */
  @media (max-width:900px){
    /* align-items:center הוא תיקון באג ולא עיצוב: בזמן הטעינה הרשימה עוד
       ריקה, שורת הרשת נמתחת לגובה המסך, וברירת המחדל (stretch) מתחה כל
       צ'יפ ל-300 פיקסל גובה — עם radius של 999px הוא נראה כביצה ענקית. */
    .rail{flex-direction:row; align-items:center; gap:6px; overflow-x:auto; padding:2px 0 4px; scrollbar-width:none}
    .rail::-webkit-scrollbar{display:none}
    .rail h4, .rail .sep{display:none}
    /* שם תגית ארוך ייצור צ'יפ ענק שבולע את השורה — תקרת רוחב מחזירה
       אותו לגודל הרגיל והשם מתקצר בשלוש נקודות */
    .rail-b{width:auto; flex:0 0 auto; max-width:170px; border:1px solid var(--line); background:var(--surface);
      padding:8px 13px; font-size:13.5px}
    .rail-b.on{border-color:transparent}
    .rail .clr{margin:0; flex:0 0 auto; align-self:center}
  }

  /* ---------- תיוג ותדירות בשורת ההוספה ---------- */
  .addtag{position:relative}
  .addtag-b{display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); border-radius:9px; padding:8px 11px; font-size:13.5px; font-weight:600; cursor:pointer}
  .addtag-b.on{border-color:var(--brand); color:var(--brand-deep); background:var(--tint)}
  .addpop{position:absolute; bottom:44px; inset-inline-start:0; z-index:45; width:214px; background:var(--surface);
    border:1px solid var(--line-strong); border-radius:11px; box-shadow:var(--shadow-hover); padding:6px}
  .newtag{display:flex; gap:6px; margin-top:6px; padding-top:7px; border-top:1px solid var(--line-soft)}
  .newtag input{flex:1; min-width:0; border:1px solid var(--line); background:var(--surface); color:var(--text);
    border-radius:8px; padding:7px 9px; font-size:13.5px; font-family:inherit}
  .newtag input:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--ring)}
  .newtag button{flex:0 0 auto; width:34px; border:none; background:var(--primary); color:var(--primary-tx);
    border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center}
  .newtag button:disabled{opacity:.4; cursor:default}

  /* ---------- עריכה בהקשה כפולה ---------- */
  .tedit{width:100%; border:1px solid var(--brand); background:var(--surface); color:var(--text);
    border-radius:9px; padding:8px 10px; font-size:16px; font-family:inherit; line-height:1.35;
    resize:none; min-height:40px; max-height:180px; box-shadow:0 0 0 3px var(--ring); display:block}
  .tedit:focus{outline:none}
  .gedit{flex:1; min-width:0; border:1px solid var(--brand); background:var(--surface); color:var(--text);
    border-radius:8px; padding:6px 9px; font-size:16px; font-weight:600; font-family:inherit}
  .gedit:focus{outline:none; box-shadow:0 0 0 3px var(--ring)}
  /* רמז שאפשר לערוך — רק בעכבר, כדי לא להוסיף רעש בנייד */
  @media (hover:hover){ .ttitle:hover, .gname:hover{text-decoration:underline; text-decoration-style:dotted;
    text-decoration-color:var(--muted-2); text-underline-offset:3px} }

  /* ---------- החלקה בנייד: ימינה = מחיקה, שמאלה = קידום ---------- */
  .trow.sw-del{background:var(--danger-bg); border-color:var(--danger)}
  .trow.sw-next{background:var(--doing-bg); border-color:var(--doing-dot)}
  .trow.sw-go{box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .trow.sw-del::after, .trow.sw-next::after{
    position:absolute; top:50%; transform:translateY(-50%); font-size:12.5px; font-weight:800; pointer-events:none}
  .trow.sw-del::after{content:'מחיקה'; inset-inline-end:14px; color:var(--danger)}
  .trow.sw-next::after{content:'קידום'; inset-inline-start:14px; color:var(--doing-tx)}

  /* ---------- Layout ---------- */
  /* לשונית המשימות היא שלושה טורים: מסילת תיוגים בקצה הפנימי (ימין ב-RTL),
     הרשימה במרכז, והאג׳נדה בקצה החיצוני. minmax(0,1fr) ולא 1fr — פריט גריד
     לא מתכווץ מתחת לתוכנו, ובלי זה רשת השעות דוחפת את כל העמוד לגלילה אופקית. */
  /* min-height מבטיח שתמיד יש מספיק עמוד כדי לגלול את הבאנר החוצה. בלעדיו
     לשונית קצרה (קניות עם חמישה פריטים) פשוט לא נגללת, והלשוניות הנעוצות
     "נופלות" חזרה מתחת לבאנר בכל מעבר אליה — זו הקפיצה שנראית לעין. */
  .layout{display:grid; grid-template-columns:172px minmax(0,1fr) 306px; gap:16px; padding:10px 16px 180px;
    min-height:calc(100vh - 50px)}
  .layout.is-wide{grid-template-columns:minmax(0,1fr)}
  @media (max-width:1080px){
    .layout{grid-template-columns:150px minmax(0,1fr) 272px; gap:12px}
  }
  @media (max-width:900px){
    .layout{grid-template-columns:1fr; padding-bottom:200px; gap:10px}
    /* בנייד נשארים התיוגים צמוד מעל הרשימה שהם מסננים (האג׳נדה שבצד
       לא מרונדרת שם בכלל — ראו התנאי בקומפוננטה).
       align-self:start מונע מהמסילה לקבל שורת רשת בגובה המסך כשהרשימה
       שמתחתיה עוד ריקה — הסיבה השורשית של הצ'יפים המתוחים. */
    .layout .rail{order:-1; align-self:start}
  }
  /* מסגרת עדינה למסילת התיוגים — באותו קו עיצובי של שאר הפאנלים */
  @media (min-width:901px){
    .rail{background:var(--surface); border:1px solid var(--line); border-radius:18px;
      box-shadow:var(--shadow); padding:12px 7px; align-self:start}
    .rail h4{padding-inline-start:10px}
    .rail .sep{margin:7px 10px}
    .rail .clr{margin:8px 10px 2px}
  }

  /* ---------- Board ---------- */
  .board{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:11px; align-content:start}
  @media (max-width:640px){ .board{grid-template-columns:1fr} }
  .col{background:var(--col-bg); border-radius:18px; padding:9px 9px 5px; min-height:64px}
  .col-head{display:flex; align-items:center; gap:8px; padding:5px 6px 10px; font-weight:700; font-size:13px}
  .col-head .dot{width:9px; height:9px; border-radius:50%}
  .col-head .count{margin-inline-start:auto; background:var(--surface); color:var(--muted); border-radius:999px;
    padding:1px 9px; font-size:12px; font-weight:700}
  .col-list{position:relative; min-height:26px}
  .col-empty{color:var(--muted-2); font-size:12px; text-align:center; padding:8px 0 12px}
  .drop-line{position:absolute; left:4px; right:4px; height:3px; border-radius:3px; background:var(--brand);
    box-shadow:0 0 0 3px var(--ring); pointer-events:none; z-index:5}

  /* ---------- Card (קומפקטי) ---------- */
  .card{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:12px 13px; margin-bottom:9px;
    transition:box-shadow .16s ease, border-color .16s ease}
  .card:hover{box-shadow:var(--shadow-hover); border-color:var(--line-strong)}
  .card.st-done{background:var(--done-card); border-color:color-mix(in srgb, var(--done-dot) 15%, var(--line))}
  .card.ghost{opacity:.35}
  .top{display:flex; align-items:flex-start; gap:9px}
  .grip{width:18px; align-self:stretch; display:flex; align-items:center; justify-content:center; color:var(--muted-2);
    cursor:grab; touch-action:none; flex:0 0 auto; margin:-2px -3px -2px -4px; border-radius:6px}
  .grip:hover{color:var(--muted); background:var(--tile-bg)}
  .grip:active{cursor:grabbing}
  .ic{width:32px; height:32px; border-radius:9px; flex:0 0 auto; display:flex; align-items:center; justify-content:center}
  .grow{flex:1; min-width:0}
  .ttl h3{margin:0; font-size:15.5px; font-weight:500; line-height:1.4; word-break:break-word; white-space:pre-wrap}
  .meta{margin:3px 0 0; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:5px; flex-wrap:wrap}
  .dotsep{width:3px; height:3px; border-radius:50%; background:var(--muted-2); flex:0 0 auto}
  .tags{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px}
  .tg{display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:2px 10px; font-size:11px; font-weight:600}
  .tg .td{width:6px; height:6px; border-radius:50%}
  .av{width:27px; height:27px; border-radius:50%; flex:0 0 auto; color:#fff; font-weight:700; font-size:11px;
    display:flex; align-items:center; justify-content:center}
  .av-shared{background:var(--tile-bg); color:var(--muted)}
  /* עיגול שנדחס בתוך שורת flex צרה נמתח לביצה. כל העיגולים באפליקציה
     מקבלים כאן הגנה אחת: לא להתכווץ, ולשמור יחס 1:1 גם אם רק אחד
     המימדים נקבע (האווטארים מקבלים גודל ב-inline style מהקומפוננטה). */
  .av, .who, .dot, .swatch, .flag, .tg .td, .pill .d, .col-head .dot{
    flex:0 0 auto; aspect-ratio:1; box-sizing:border-box}

  .locrow{display:flex; align-items:center; gap:6px; margin-top:7px; text-decoration:none;
    background:var(--tile-bg); border:1px solid var(--line); border-radius:8px; padding:5px 9px;
    color:var(--muted); font-size:12px}
  .locrow .lname{color:var(--text); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0}

  .foot{display:flex; align-items:center; gap:5px; margin-top:8px}
  .pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:7px}
  .pill .d{width:6px; height:6px; border-radius:50%}
  .pill.todo{background:var(--todo-bg); color:var(--todo-tx)} .pill.todo .d{background:var(--todo-dot)}
  .pill.doing{background:var(--doing-bg); color:var(--doing-tx)} .pill.doing .d{background:var(--doing-dot)}
  .pill.done{background:var(--done-bg); color:var(--done-tx)} .pill.done .d{background:var(--done-dot)}
  .spacer{margin-inline-start:auto}

  .ibtn{width:29px; height:29px; border-radius:8px; border:1px solid transparent; background:transparent; color:var(--muted);
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:.12s; flex:0 0 auto; padding:0}
  .ibtn:hover{background:var(--tile-bg); color:var(--text)}
  .ibtn.del:hover{background:var(--danger-bg); color:var(--danger)}
  .ibtn.done{background:var(--done-bg); color:var(--done-tx)}
  .ibtn.done:hover{filter:brightness(.96)}
  .ibtn.tag.on{background:var(--tint); color:var(--brand-deep)}

  .flag{position:absolute; inset-inline-end:9px; top:9px; width:18px; height:18px; border-radius:50%;
    background:var(--done-dot); color:var(--flag-tx); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:11px}

  /* ---------- רשימת משימות (צ'קליסט אנכי) ---------- */
  .tasklist{position:relative; display:flex; flex-direction:column; gap:9px}
  .tsec{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:var(--muted); padding:10px 4px 2px}
  .tsec .n{background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:1px 8px; font-size:11.5px}
  /* כמו בפתקים: גרירה מכל מקום בשורה, הרמה קלה בריחוף והצללה מודגשת בגרירה */
  .trow{position:relative; display:flex; align-items:flex-start; gap:11px; background:var(--surface);
    border:1px solid var(--line); border-radius:16px; padding:14px 15px; box-shadow:var(--shadow);
    cursor:grab; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:pan-y;
    transition:box-shadow .18s ease, transform .18s ease, border-color .16s ease, background .16s ease}
  /* הצל מופיע בריחוף ולא במנוחה — הוא סימן שאפשר לגעת, לא קישוט קבוע */
  .trow:hover{border-color:var(--line-strong); transform:translateY(-2px); box-shadow:var(--shadow-hover)}
  .trow:active{cursor:grabbing}
  /* ה-transform של הריחוף יוצר הקשר ערימה שכולא את החלונית בתוך השורה,
     ולכן השורות שאחריה מכסות אותה. בזמן שחלונית פתוחה מבטלים את ההרמה
     ומרימים את השורה כולה מעל השאר. */
  .trow.pop{z-index:60}
  .trow.pop:hover{transform:none}
  /* מניעת סימון טקסט כחול בלחיצה ארוכה בנייד — חייב לחול גם על הצאצאים */
  .trow, .trow *{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
  /* אלמנטים אינטראקטיביים בתוך השורה לא מתחילים גרירה */
  .trow .no-drag{cursor:pointer; touch-action:auto}
  body.dragging{touch-action:none}
  body.dragging .trow{cursor:grabbing}
  .trow.is-done{background:var(--done-card); border-color:color-mix(in srgb, var(--done-dot) 18%, var(--line))}
  .trow.ghost{opacity:.35}
  .tcheck{flex:0 0 auto; width:22px; height:22px; margin-top:1px; padding:0; border-radius:8px; cursor:pointer;
    border:1.8px solid var(--line-strong); background:var(--surface); color:#fff;
    display:flex; align-items:center; justify-content:center; transition:.14s}
  .tcheck:hover{border-color:var(--done-dot)}
  .trow.is-done .tcheck{background:var(--done-dot); border-color:var(--done-dot)}
  .tmain{flex:1; min-width:0}
  /* משימות ארוכות מקוצרות ל-2 שורות; לחיצה על הכותרת פותחת את המלאה */
  .ttitle{font-size:15.5px; font-weight:500; line-height:1.4; word-break:break-word; white-space:pre-wrap;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; cursor:pointer}
  .ttitle.open{-webkit-line-clamp:unset; overflow:visible}
  .tmore{font-size:11.5px; font-weight:700; color:var(--brand-deep); cursor:pointer; margin-top:3px}
  .trow.is-done .ttitle{text-decoration:line-through; color:var(--muted)}
  .tmeta{display:flex; flex-wrap:wrap; align-items:center; gap:5px; margin-top:6px}
  .tchip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; border-radius:999px;
    padding:3px 10px; background:var(--tile-bg); color:var(--muted); white-space:nowrap; max-width:100%}
  .tchip.rem{background:var(--doing-bg); color:var(--doing-tx)}
  .tchip.rem-sent{background:var(--done-bg); color:var(--done-tx)}
  .tby{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--muted-2); font-weight:600}
  .tacts{display:flex; align-items:center; gap:2px; flex:0 0 auto}

  /* משיכה לרענון */
  .pullr{position:fixed; top:6px; left:50%; margin-inline-start:-18px; width:36px; height:36px; z-index:60;
    display:flex; align-items:center; justify-content:center; border-radius:50%; opacity:0; pointer-events:none;
    background:var(--surface); border:1px solid var(--line-strong); box-shadow:var(--shadow); color:var(--muted);
    transform:translateY(0)}
  .pullr.ready{color:var(--brand-deep); border-color:var(--brand)}
  .pullr.spin{opacity:1!important; transform:translateY(70px)!important; color:var(--brand-deep);
    animation:pullspin .8s linear infinite}
  @keyframes pullspin{ to{ transform:translateY(70px) rotate(360deg) } }

  /* כפתור "בעבודה" פעיל */
  .ibtn.doing.on{background:color-mix(in srgb, #e0913a 22%, var(--surface)); color:#b06d1c; border-color:transparent}

  /* בורר צבע — עיגולים, כמו בפתקים */
  .colorpop{position:absolute; z-index:41; inset-inline-end:6px; top:40px; background:var(--surface);
    border:1px solid var(--line-strong); border-radius:11px; box-shadow:0 2px 6px rgba(0,0,0,.3); padding:9px;
    display:grid; grid-template-columns:repeat(6,26px); gap:7px; width:max-content}
  .swatch{width:26px; height:26px; border-radius:50%; border:1px solid var(--line-strong); padding:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:#3c4043; transition:transform .12s}
  .swatch:hover{transform:scale(1.12)}
  .swatch.sel{border:2px solid var(--text)}
  .swatch.none{background:var(--surface); position:relative; overflow:hidden}
  .swatch.none::after{content:''; position:absolute; width:130%; height:1.5px; background:var(--muted-2); transform:rotate(-45deg)}

  /* tag popover */
  .tagback{position:fixed; inset:0; z-index:40}
  .tagpop{position:absolute; z-index:41; inset-inline-end:6px; top:40px; background:var(--surface); border:1px solid var(--line-strong);
    border-radius:11px; box-shadow:var(--shadow); padding:6px; width:196px}
  .tagpop.up, .colorpop.up{top:auto; bottom:44px}
  .tagpop .h{font-size:11px; color:var(--muted); font-weight:700; padding:4px 7px}
  .topt{display:flex; align-items:center; gap:8px; padding:6px 7px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600}
  .topt:hover{background:var(--tile-bg)}
  .topt .box{width:16px; height:16px; border-radius:5px; border:2px solid var(--line-strong); display:flex; align-items:center; justify-content:center; flex:0 0 auto}
  .topt.sel .box{border-color:transparent}
  .topt .tico{display:flex; align-items:center; flex:0 0 auto}
  .tagpop .done-btn{width:100%; margin-top:5px; border:none; background:var(--primary); color:var(--primary-tx);
    border-radius:8px; padding:8px; font-size:13px; font-weight:700; cursor:pointer}

  /* drag float */
  .drag-float{position:fixed; top:0; left:0; z-index:1000; pointer-events:none; will-change:transform;
    transform-origin:top right; filter:drop-shadow(0 12px 22px rgba(0,0,0,.22))}
  .drag-float .trow{margin:0; transform:rotate(-1.4deg) scale(1.02); border-color:var(--brand);
    box-shadow:0 8px 20px rgba(0,0,0,.3)}
  .flip{transition:transform .2s cubic-bezier(.2,.8,.3,1)}

  /* ---------- Shopping list ---------- */
  .shop{background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); overflow:hidden}
  .shop-head{display:flex; align-items:center; gap:9px; padding:14px 16px; border-bottom:1px solid var(--line);
    font-weight:700; font-size:15px}
  .shop-head .n{margin-inline-start:auto; font-size:12.5px; color:var(--muted); font-weight:700}
  /* מתג שתי הרשימות — סופר / אחר. מגולען ולא לשוניות, כדי שלא יתחרה
     ויזואלית בחוצצים הראשיים שמעליו */
  .shop-switch{display:flex; gap:6px; padding:10px 12px 2px}
  .sw-b{flex:1 1 0; display:flex; align-items:center; justify-content:center; gap:7px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--muted);
    border-radius:11px; padding:9px 10px; font-family:inherit; font-size:13.5px;
    font-weight:700; cursor:pointer; transition:.13s; min-width:0}
  .sw-b:hover{border-color:var(--line-strong); color:var(--text)}
  .sw-b.on{background:var(--tint); color:var(--brand-ink); border-color:var(--brand);
    box-shadow:var(--shadow)}
  .sw-b .em{font-size:15px; line-height:1}
  .sw-b .c{background:var(--tile-bg); color:var(--muted); border-radius:999px;
    padding:0 7px; font-size:11.5px; font-weight:700}
  .sw-b.on .c{background:color-mix(in srgb, var(--brand) 22%, var(--surface)); color:var(--brand-ink)}
  @media (max-width:900px){ .sw-b{padding:11px 10px; font-size:14.5px} }

  .shop-body{padding:8px 12px 14px; position:relative}
  .shop-sec{margin-top:2px}
  /* כותרת מחלקה — אותו פונט, גודל ומשקל כמו כותרת מקטע בשאר הלוח (.tsec).
     קודם היא הייתה 800 עם ריווח אותיות, ונראתה כמו גופן אחר */
  .shop-sec-h{display:flex; align-items:center; gap:8px; padding:10px 4px 6px;
    font-family:inherit; font-size:12.5px; font-weight:700; letter-spacing:normal; color:var(--muted)}
  .shop-sec-h .dept-em{font-size:15px; line-height:1; flex:0 0 auto}
  .shop-sec-h .c{margin-inline-start:auto; background:var(--tile-bg); color:var(--muted); border-radius:999px;
    padding:1px 8px; font-size:11px; font-weight:700}
  .gitem{display:flex; align-items:center; gap:9px; border:1px solid var(--line); border-radius:14px;
    padding:11px 13px; margin-bottom:8px; background:var(--surface-2);
    transition:opacity .15s, box-shadow .16s, border-color .16s}
  .gitem:hover{border-color:var(--line-strong); box-shadow:var(--shadow-hover)}
  .gitem.dragging{opacity:.35}
  .ghandle{width:22px; align-self:stretch; display:flex; align-items:center; justify-content:center; color:var(--muted-2);
    cursor:grab; touch-action:none; flex:0 0 auto; margin:-9px -4px -9px -2px; border-radius:8px}
  .ghandle:hover{color:var(--muted); background:var(--tile-bg)}
  .ghandle:active{cursor:grabbing}
  .gbox{width:24px; height:24px; border-radius:7px; border:2px solid var(--line-strong); background:var(--surface);
    cursor:pointer; flex:0 0 auto; display:flex; align-items:center; justify-content:center; color:#fff; transition:.13s}
  .gbox:hover{border-color:var(--brand)}
  .gitem.bought .gbox{background:var(--done-dot); border-color:var(--done-dot)}
  /* השם והפקדים. במחשב הכל בשורה אחת; בנייד ראו את ה-media למטה.
     overflow-wrap ולא word-break: שובר רק מילה שבאמת לא נכנסת לשורה
     שלמה, במקום לפרק כל מילה שנדחקת ל"אב/טי/ח" */
  .gmain{flex:1; min-width:0; display:flex; align-items:center; gap:9px}
  .gctl{margin-inline-start:auto; flex:0 0 auto; display:flex; align-items:center; gap:9px}
  .gname{flex:1; min-width:0; font-size:15.5px; font-weight:600; overflow-wrap:break-word}
  .gitem.bought .gname{text-decoration:line-through; color:var(--muted-2); text-decoration-thickness:2px}
  .gqty{font-size:12px; color:var(--muted); background:var(--tile-bg); border-radius:999px; padding:2px 10px; font-weight:700; flex:0 0 auto}
  .gitem .av{flex:0 0 auto}
  /* בורר כמות +/- (#6) */
  .qty{display:flex; align-items:center; gap:2px; background:var(--surface); border:1px solid var(--line);
    border-radius:9px; padding:2px; flex:0 0 auto}
  .qbtn{width:26px; height:26px; border:none; background:transparent; color:var(--brand-deep); border-radius:7px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0}
  .qbtn:hover{background:var(--tile-bg)}
  .qbtn:disabled{color:var(--muted-2); cursor:default}
  .qn{min-width:22px; text-align:center; font-size:14px; font-weight:800; color:var(--text)}
  .gitem .ibtn{width:27px; height:27px}
  /* גרירה */
  .shop-drop{position:absolute; inset-inline:8px; height:3px; border-radius:3px; background:var(--brand);
    box-shadow:0 0 0 3px var(--ring); pointer-events:none; z-index:5}
  .shop-float{position:fixed; top:0; left:0; z-index:1000; pointer-events:none; will-change:transform;
    filter:drop-shadow(0 12px 22px rgba(0,0,0,.22))}
  .shop-float .gitem{margin:0; background:var(--surface); border-color:var(--brand);
    transform:rotate(-1deg) scale(1.02); padding:11px 14px}
  .shop-sep{display:flex; align-items:center; gap:9px; margin:16px 2px 9px; color:var(--muted); font-size:12.5px; font-weight:700}
  .shop-sep::before,.shop-sep::after{content:""; height:1px; background:var(--line); flex:1}
  .shop-empty{color:var(--muted); text-align:center; padding:22px 8px; font-size:14px; line-height:1.7}

  /* ---------- Sidebar ---------- */
  .side{display:flex; flex-direction:column; gap:13px}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); overflow:hidden}
  .panel-head{display:flex; align-items:center; gap:9px; padding:12px 14px; font-weight:700; font-size:14px; border-bottom:1px solid var(--line)}
  .panel-head .ph-ic{color:var(--brand-deep)}
  .panel-body{padding:5px 12px 11px}
  .ev{display:flex; gap:10px; align-items:center; padding:8px 3px; border-bottom:1px solid var(--line-soft)}
  .ev:last-child{border-bottom:none}
  .ev-when{flex:0 0 auto; width:50px; text-align:center; background:var(--tint); color:var(--brand-ink);
    border-radius:9px; padding:6px 2px; line-height:1.15}
  .ev-when .d{font-size:11px; opacity:.8} .ev-when .t{font-size:14px; font-weight:800}
  .ev-body{flex:1; min-width:0}
  .ev-title{font-size:13px; font-weight:600; word-break:break-word}
  .ev-rel{font-size:11.5px; color:var(--muted); margin-top:2px}
  .ev-rem{display:flex; align-items:center; gap:4px; font-size:11px; font-weight:600; margin-top:4px;
    color:var(--doing-tx); background:var(--doing-bg); border-radius:6px; padding:2px 7px; width:max-content; max-width:100%}
  .ev-rem.none{color:var(--muted-2); background:var(--tile-bg); font-weight:500}
  .side-empty{color:var(--muted); font-size:12.5px; text-align:center; padding:14px 8px; line-height:1.6}
  .act-item{display:flex; gap:9px; align-items:flex-start; padding:8px 3px; border-bottom:1px solid var(--line-soft)}
  .act-item:last-child{border-bottom:none}
  .act-txt{flex:1; min-width:0; font-size:12.5px; line-height:1.5}
  .act-txt b{font-weight:700}
  .act-verb{border-radius:6px; padding:1px 7px; font-size:11px; font-weight:700; margin-inline-start:5px}
  .v-add{background:var(--tile-bg); color:var(--muted)}
  .v-done{background:var(--done-bg); color:var(--done-tx)}
  .v-del{background:var(--danger-bg); color:var(--danger)}
  .v-upd{background:var(--doing-bg); color:var(--doing-tx)}
  .act-time{font-size:11px; color:var(--muted-2); margin-top:2px}

  /* הודעת מערכת — יושבת מעל שורת ההוספה ולא מסתירה אותה */
  .toast{position:fixed; z-index:31; inset-inline:0; bottom:calc(122px + env(safe-area-inset-bottom));
    margin-inline:auto; width:max-content; max-width:calc(100% - 32px);
    display:flex; align-items:center; gap:8px; cursor:pointer;
    background:var(--danger-bg); color:var(--danger); border:1px solid currentColor;
    border-radius:999px; padding:9px 16px; font-size:13.5px; font-weight:700;
    box-shadow:0 6px 20px rgba(0,0,0,.13); animation:toastin .18s ease}
  @keyframes toastin{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){ .toast{animation:none} }

  /* ---------- שורת ה-AI ---------- */
  .aitog{display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); border-radius:9px; padding:7px 12px; font-family:inherit; font-size:12.5px;
    font-weight:800; letter-spacing:.3px; cursor:pointer; transition:.14s}
  .aitog:hover{border-color:var(--line-strong); color:var(--text)}
  .aitog.on{background:linear-gradient(135deg, var(--tint), var(--tint-2)); color:var(--brand-ink);
    border-color:var(--brand); box-shadow:var(--shadow)}
  .ai-gear{width:32px; height:32px; border-radius:9px; border:1px solid var(--line); background:var(--surface);
    color:var(--muted-2); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0}
  .ai-gear:hover{border-color:var(--line-strong); color:var(--text)}
  /* מסגרת עדינה שמסמנת שהשורה "חיה" */
  .addbar.ai{border-top-color:var(--brand)}
  .add-btn.ai{background:linear-gradient(135deg, var(--brand-2), var(--brand-deep))}
  .add-btn.busy{opacity:.75}
  .add-btn.busy svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .add-btn.busy svg{animation:none} }
  .aihelp{margin:0 0 14px; font-size:13px; line-height:1.65; color:var(--muted)}
  .ailbl{display:block; font-size:12px; font-weight:700; color:var(--muted); margin:10px 0 5px}
  .aiinp{width:100%; border:1px solid var(--line); background:var(--surface); color:var(--text);
    border-radius:9px; padding:10px 11px; font-size:13.5px; font-family:inherit}
  .aiinp:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--ring)}
  .aitest{margin-top:11px; font-size:12.5px; font-weight:700; color:var(--muted)}
  .aitest.ok{color:var(--brand-deep)} .aitest.bad{color:var(--danger)}
  .aibtns{display:flex; gap:8px; margin-top:16px; justify-content:flex-end}

  /* ---------- Add bar ---------- */
  .addbar{position:fixed; bottom:0; left:0; right:0; z-index:30; background:var(--surface);
    border-top:1px solid var(--line-strong); padding:9px 12px; padding-bottom:calc(9px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 16px rgba(0,0,0,.05)}
  .addbar-in{max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:8px; min-width:0}
  .add-opts{display:flex; gap:8px; align-items:center; flex-wrap:wrap; min-width:0}
  .addbar select{border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:9px;
    padding:8px 10px; font-size:13.5px; cursor:pointer; font-weight:600}
  .who-pick{display:flex; gap:6px; flex:0 0 auto}
  .who{width:32px; height:32px; border-radius:50%; border:2px solid transparent; color:#fff; font-weight:700;
    font-size:12px; cursor:pointer; opacity:.42; transition:.13s; display:flex; align-items:center; justify-content:center;
    flex:0 0 auto; aspect-ratio:1; box-sizing:border-box}
  .who.shared{background:var(--tile-bg); color:var(--muted)}
  .who.on{opacity:1; border-color:var(--brand)}
  .date-toggle{margin-inline-start:auto; display:flex; align-items:center; justify-content:center;
    width:37px; height:37px; border:1px solid var(--line); background:var(--surface); color:var(--muted);
    border-radius:9px; cursor:pointer}
  .date-toggle.on{border-color:var(--brand); color:var(--brand-deep)}
  .addbar input[type=datetime-local]{border:1px solid var(--line); background:var(--surface); color:var(--text);
    border-radius:9px; padding:9px 11px; font-size:14px; font-family:inherit; width:100%}
  .add-main{display:flex; gap:8px; align-items:flex-end; min-width:0}
  /* field-sizing:content מודד גם את הרוחב לפי הטקסט (וכשהשדה ריק — לפי
     ה-placeholder הארוך). ברוחב מסך צר זה תפח את שורת ההוספה מעבר לגלולת
     המסך וגרר את כל העמוד לגלילה אופקית. width מפורש מכבה את מדידת הרוחב
     ומשאיר רק את גדילת הגובה, שהיא מה שרצינו ממנו. */
  .add-main textarea{flex:1 1 0%; min-width:0; width:100%; max-width:100%; box-sizing:border-box;
    border:1px solid var(--line); background:var(--surface); color:var(--text);
    border-radius:14px; padding:12px 14px; font-size:16px; font-family:inherit; line-height:1.35;
    resize:none; field-sizing:content; min-height:46px; max-height:132px; overflow-y:auto; display:block}
  .add-main textarea::placeholder{color:var(--muted-2)}
  .add-main textarea:focus,.addbar select:focus,.addbar input[type=datetime-local]:focus{
    outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--ring)}
  .add-btn{flex:0 0 auto; border:none; background:var(--primary); color:var(--primary-tx); width:46px; height:46px;
    border-radius:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow); transition:box-shadow .16s, filter .16s}
  .add-btn:hover:not(:disabled){box-shadow:var(--shadow-hover); filter:brightness(1.06)}
  .add-btn:disabled{opacity:.4; cursor:default}

  .board-empty{grid-column:1 / -1; text-align:center; color:var(--muted); padding:30px 0; font-size:14px; line-height:1.7}

  /* ---------- Modal (עריכת קטגוריות) ---------- */
  .overlay{position:fixed; inset:0; z-index:60; background:rgba(20,21,15,.5); display:flex; align-items:flex-end; justify-content:center; padding:0}
  @media (min-width:640px){ .overlay{align-items:center; padding:20px} }
  .modal{background:var(--surface); width:100%; max-width:460px; border-radius:18px 18px 0 0; box-shadow:0 -8px 40px rgba(0,0,0,.3);
    max-height:86vh; display:flex; flex-direction:column}
  @media (min-width:640px){ .modal{border-radius:18px} }
  .modal-head{display:flex; align-items:center; gap:9px; padding:16px 18px; border-bottom:1px solid var(--line); font-weight:800; font-size:16px}
  .modal-head .x{margin-inline-start:auto}
  .modal-body{padding:12px 16px; overflow:auto}
  .cat-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line-soft)}
  .cat-ico{width:40px; height:40px; border-radius:10px; border:none; cursor:pointer; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center}
  .cat-row input[type=text]{flex:1; min-width:0; border:1px solid var(--line); background:var(--surface); color:var(--text);
    border-radius:9px; padding:9px 11px; font-size:15px; font-family:inherit}
  .cat-row input[type=text]:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--ring)}
  .cat-exp{background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:11px 12px; margin:2px 0 8px}
  .exp-lbl{font-size:11.5px; font-weight:700; color:var(--muted); margin:2px 2px 7px}
  .sw-grid{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
  .sw{width:30px; height:30px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0}
  .sw.on{box-shadow:0 0 0 2px var(--surface-2),0 0 0 4px var(--text)}
  .ic-grid{display:flex; flex-wrap:wrap; gap:7px}
  .icch{width:36px; height:36px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--muted);
    cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0}
  .icch:hover{border-color:var(--line-strong); color:var(--text)}
  .icch.on{border-width:2px; background:var(--surface-2)}
  .cat-add{display:flex; gap:8px; margin-top:14px}
  .btn-line{border:1px solid var(--line-strong); background:var(--surface); color:var(--text); border-radius:10px;
    padding:10px 14px; font-size:14px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:7px}
  .btn-line:hover{background:var(--tile-bg)}
  .btn-fill{border:none; background:var(--primary); color:var(--primary-tx); border-radius:10px; padding:10px 16px;
    font-size:14px; font-weight:700; cursor:pointer; flex:1}
  .modal-note{font-size:12px; color:var(--muted); line-height:1.6; margin:12px 2px 2px}

  /* ---------- Setup ---------- */
  .setup{max-width:520px; margin:40px auto; padding:24px; background:var(--surface);
    border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); line-height:1.8}
  .setup h2{margin-top:0; font-weight:700}
  .setup code{background:var(--tile-bg); color:var(--text); padding:2px 6px; border-radius:6px; font-size:13px}

  /* ---------- Mobile polish (#7) — גדול, נוח ומותאם למגע ---------- */
  @media (max-width:900px){
    .filters{flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding:12px 12px 6px}
    .filters::-webkit-scrollbar{display:none}
    .chip{padding:9px 14px; font-size:14.5px}
    .chip .cnt{font-size:12px}
    .layout{padding:8px 12px 190px; gap:12px}
    .shop{border-radius:18px}
    .shop-head{font-size:16px; padding:15px 16px}
    .shop-body{padding:8px 10px 16px}
    .shop-sec-h{font-size:13.5px; padding:12px 4px 7px}
    .gitem{padding:12px 12px; gap:10px; border-radius:13px; margin-bottom:9px}
    /* בנייד השם מקבל שורה שלמה והפקדים יורדים מתחתיו. שבע פקדים בשורה
       אחת השאירו לשם 37 פיקסלים בלבד — "אבטיח" נשבר ל"אב/טי/ח" */
    .gmain{flex-direction:column; align-items:stretch; gap:9px}
    .gctl{margin-inline-start:0; justify-content:flex-end}
    .gname{font-size:17px}
    .gbox{width:28px; height:28px; border-radius:8px}
    .ghandle{width:26px; margin:-12px -4px -12px -2px}
    .qbtn{width:32px; height:32px}
    .qn{min-width:26px; font-size:16px}
    .gitem .ibtn{width:34px; height:34px}
    .panel-head{font-size:15px; padding:14px 15px}

    /* רשימת המשימות — גדולה ומרווחת יותר במגע */
    .tasklist{gap:10px}
    /* אותו סיפור כמו בקניות: שורת הכפתורים לקחה 150 פיקסלים והשאירה
       לכותרת 117, אז כל משפט נשבר לשתי שורות. בנייד הכותרת מקבלת את
       הרוחב, והכפתורים יורדים לשורה שמתחתיה. */
    .trow{padding:15px 16px; border-radius:18px;
      display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:12px; row-gap:10px;
      align-items:start}
    .tcheck{width:26px; height:26px; border-radius:8px; grid-column:1; grid-row:1}
    .tmain{grid-column:2; grid-row:1}
    .tacts{grid-column:2; grid-row:2; justify-content:flex-end; flex-wrap:wrap}
    .ttitle{font-size:16.5px; line-height:1.4}
    .tmeta{gap:6px; margin-top:8px}
    .tchip{font-size:12.5px; padding:3px 9px}
    .tby{font-size:12.5px}
    /* גודל האווטאר נקבע ב-inline style מהקומפוננטה, ולכן צריך !important */
    .trow .av{width:22px!important; height:22px!important; font-size:10.5px}
    .trow .grip{width:26px}
    .locrow{font-size:13.5px; padding:7px 11px; margin-top:9px; border-radius:10px}
    .ibtn{width:36px; height:36px; border-radius:10px}
  }
  @media (max-width:520px){
    .brand .logo-img{height:78px}
    .add-opts{gap:6px}
    .who{width:34px; height:34px}
    .add-main textarea{min-height:50px}
  }
</style>
</head>

/* משימות וקניות תמיד ראשונות (מימין) — הכי שימושיות (#11) */
function orderCats(arr){
  const pri = ['task','grocery'];
  const head = [];
  pri.forEach(k => { const c = arr.find(x => x.key===k); if(c) head.push(c); });
  const rest = arr.filter(c => !pri.includes(c.key));
  return [...head, ...rest];
}
const CATS_LS = 'hamal_cats_v1';
function loadCats(){
  try{
    const raw = localStorage.getItem(CATS_LS);
    if(raw){ const arr = JSON.parse(raw); if(Array.isArray(arr) && arr.length) return orderCats(withReminderCat(arr.map(c=>({icon:IC.tag, ...c})))); }
  }catch(e){}
  return orderCats(DEFAULT_CATS.map(c=>({...c})));
}
/* מי שכבר השתמש בלוח שמר רשימת תגיות ישנה ב-localStorage, ולכן תוספת
   ל-DEFAULT_CATS לבדה לא הייתה מגיעה אליו לעולם. */
function withReminderCat(arr){
  if (arr.find(c => c.key === REMINDER_KEY)) return arr;
  const def = DEFAULT_CATS.find(c => c.key === REMINDER_KEY);
  return arr.concat([{ ...def }]);
}

const DEFAULT_PREFS = { view:'task', chips:[], calMode:'week', calOwners:null, shopList:'super' };
const SHOP_LIST_KEYS = { super:1, other:1 };
function loadPrefs(){
  /* ברירת המחדל היא כל הצ'יפים דלוקים — בלי 'other', שאין לו צ'יפ */
  const allCals = () => CHIP_KEYS.slice();
  try{
    const raw = localStorage.getItem(PREFS_LS);
    if (raw){
      const p = JSON.parse(raw) || {};
      /* גרסה קודמת שמרה מערך של תצוגות דלוקות; היום זו לשונית אחת */
      const legacy = Array.isArray(p.views) ? p.views.find(k => VIEW_KEYS[k]) : '';
      /* בורר היומן היה יומן אחד ("family"/"all"); היום זו בחירה מרובה,
         וברירת המחדל היא שכולם דלוקים */

         הזה מכשיר קיים היה נטען עם התזכורות כבויות — הן פשוט לא היו
         קיימות במערך השמור. הסימון נשמר, כך שכיבוי מכוון אחר כך נשמר. */
      let cals = Array.isArray(p.calOwners)
        ? p.calOwners.filter(k => OWNER_KEYS.includes(k))
        : allCals();

        chips: Array.isArray(p.chips) ? p.chips.filter(c => typeof c === 'string') : [],

        calOwners: cals.length ? cals : allCals(),
        shopList: SHOP_LIST_KEYS[p.shopList] ? p.shopList : 'super',

      };
    }
  }catch(e){}

function normHeb(s){ return String(s||'').replace(/[׳'`״"]/g,'').replace(/[.,!?()\[\]]/g,' ').toLowerCase(); }
function classifyDept(title){
  const t = normHeb(title);
  for (const [dept, words] of DEPT_KEYWORDS){
    for (const w of words){ if (t.indexOf(normHeb(w)) !== -1) return dept; }
  }
  return 'general';
}
function classifyOther(title){
  const t = normHeb(title);
  for (const [dept, words] of ODEPT_KEYWORDS){
    for (const w of words){ if (t.indexOf(normHeb(w)) !== -1) return dept; }
  }
  return '';
}

   אחר כך מילה מובהקת שאינה סופר, ורק בסוף ברירת המחדל — סופר. */
function listOf(it){
  const d = it.details || {};
  if (d.list === 'other' || d.list === 'super') return d.list;
  if (d.dept && ODEPT_MAP[d.dept]) return 'other';
  return classifyOther(it.title) ? 'other' : 'super';
}
/* 'general' שמור מפורשות נחשב "לא סווג" — מסווגים מחדש לפי השם, כך שפריטים
   ישנים שנכנסו לכללי מוצאים את המחלקה שלהם בלי לגעת בבסיס הנתונים */
function deptOf(it){
  const d = it.details || {};
  if (listOf(it) === 'other'){
    return (d.dept && ODEPT_MAP[d.dept]) ? d.dept : (classifyOther(it.title) || 'misc');
  }
  return (d.dept && DEPT_MAP[d.dept] && d.dept !== 'general') ? d.dept : classifyDept(it.title);
}

/* מוציא כמות מספרית מטקסט חופשי: "2 חלב" / "חלב 3" / "חלב x2" -> {title, qty} */
function extractQty(text){
  let t = String(text||'').trim(); let qty = 1; let m;
  if ((m = t.match(/^(\d{1,3})\s+(\S.*)$/)))            { qty = parseInt(m[1],10); t = m[2]; }
  else if ((m = t.match(/^(.*\S)\s*[xX×*]\s*(\d{1,3})$/))) { qty = parseInt(m[2],10); t = m[1]; }
  else if ((m = t.match(/^(.*\S)\s+(\d{1,3})$/)))       { qty = parseInt(m[2],10); t = m[1]; }
  if (!(qty>0)) qty = 1;
  return { title: t.trim(), qty };
}

/* ============ עזרים ============ */
/* הבוט עשוי לרשום את השם כפי שהוא מופיע בוואטסאפ ("Yair"), ולא כמפתח הפנימי.
   הטבלה הזו ממפה את הווריאציות חזרה, כדי שהאווטאר יציג "י" ולא "Y" */
const MEMBER_ALIASES = { yair:'yair', 'יאיר':'yair', tamar:'tamar', 'תמר':'tamar', app:'app' };
function memberOf(k){
  if (MEMBERS[k]) return MEMBERS[k];
  const nk = String(k||'').trim().toLowerCase();
  let alias = MEMBER_ALIASES[nk];
  /* גם שם מלא כמו "תמר כהן" צריך להתאים — בודקים התאמה בשם הפרטי */
  if (!alias) { const hit = Object.keys(MEMBER_ALIASES).find(a => nk.indexOf(a + ' ') === 0); if (hit) alias = MEMBER_ALIASES[hit]; }
  return MEMBERS[alias] || { name:k||'?', color:'#8b8d95', short:(k||'?').slice(0,1) };
}
function statusOf(it){ return it.done ? 'done' : (it.details && it.details.status==='doing' ? 'doing' : 'todo'); }
/* תווית תזכורת: שעה בלבד אם היא באותו יום של המשימה, אחרת תאריך+שעה */
function sameDay(a,b){ return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function remLabel(when, due){ return sameDay(when, due) ? fmtTime(when) : (fmtDate(when)+' '+fmtTime(when)); }
/* תזכורת שהבוט הגדיר: details.remind_at + דגל details.reminded אחרי ששלח */
function remindOf(it){
  const d = it.details || {}; if(!d.remind_at) return null;
  const w = new Date(d.remind_at); if(isNaN(w.getTime())) return null;
  return { when:w, sent: !!d.reminded };
}
/* ============ תזכורת חוזרת ============
   נשמר ב-details.repeat. הבוט הוא זה שמזיז את המועד קדימה אחרי שהתזכורת
   נשלחת, כך שהחזרה עובדת גם כשאף אחד לא פתח את הלוח. */
const REPEATS = [
  { key:'',        label:'ללא חזרה' },
  { key:'daily',   label:'כל יום' },
  { key:'weekly',  label:'כל שבוע' },
  { key:'monthly', label:'כל חודש' },
  { key:'yearly',  label:'כל שנה' },
];
const REPEAT_LABEL = {}; REPEATS.forEach(r => { if(r.key) REPEAT_LABEL[r.key] = r.label; });
function repeatOf(it){ const r = it.details && it.details.repeat; return REPEAT_LABEL[r] ? r : ''; }

/* קידום מועד בכלל חזרה. אריתמטיקה בשעון המקומי (ולא ב-UTC) שומרת על שעת
   הקיר: תזכורת של 08:00 נשארת 08:00 גם אחרי מעבר שעון. הבוט עושה את אותו
   חישוב בצד השרת, ושם הוא נעול על שעון ישראל. */
function stepDate(d, rule){
  const x = new Date(d);
  if (rule==='daily')        x.setDate(x.getDate()+1);
  else if (rule==='weekly')  x.setDate(x.getDate()+7);
  else if (rule==='monthly') x.setMonth(x.getMonth()+1);
  else if (rule==='yearly')  x.setFullYear(x.getFullYear()+1);
  else return null;
  return x;
}
/* כל המופעים של סדרה בתוך טווח מוצג. בלי זה "כל יום ב-8" היה מצויר
   פעם אחת בשבוע במקום שבע. */
function occurrences(startIso, rule, from, to, cap){
  const out = [];
  let d = new Date(startIso);
  if (isNaN(d.getTime()) || !REPEAT_LABEL[rule]) return out;
  for (let i=0; d < from && i < 900; i++){ const n = stepDate(d, rule); if(!n) return out; d = n; }
  for (let i=0; d <= to && i < (cap||90); i++){
    out.push(new Date(d));
    const n = stepDate(d, rule); if(!n) break; d = n;
  }
  return out;
}

function responsibleOf(it){
  if (it.details && it.details.assignee) return it.details.assignee;
  if (it.created_by && it.created_by!=='app') return it.created_by;
  return 'app';
}
function tagsOf(it){ const t = it.details && it.details.tags; return Array.isArray(t) ? t : []; }

/* ============ שלושה סננים ראשיים + תיוג ============
   בבסיס הנתונים category נשאר כפי שהוא (task/grocery/medical/…), אבל בתצוגה
   יש רק שני סוגי פריטים — קניות ומשימות — ולו"ז שנגזר מ-due_at.
   קטגוריה "חכמה" (רפואה/חינוך/פיננסים/בני משפחה) מוצגת כתגית, כך שפריטים
   ישנים ממשיכים לעבוד בלי שינוי במסד הנתונים. */
const PRIMARY_KEYS = { task:1, grocery:1 };
/* צבעי הלשוניות מכוילים לחבילת "רך ושקט" — נשארים נבדלים זה מזה, אבל חמים
   מספיק כדי לא להתנגש עם המרווה של הלוח. הם עצמאיים מצבעי הקטגוריות
   שהמשתמש ערך, כדי שהלשוניות יישארו עקביות בכל מכשיר. */
const PRIMARY = [
  { key:'sched',   label:'לו"ז',   color:'#6d8fb8', icon:null },
  { key:'task',    label:'משימות', color:'#8a9a5b', icon:null },
  { key:'grocery', label:'קניות',  color:'#cf9a45', icon:null },
];
function primaryOf(it){ return it.category==='grocery' ? 'grocery' : 'task'; }
/* תזכורת חוזרת ("להשקות עציצים כל שבוע") היא לא באמת משימה פתוחה — היא
   חוזרת לנצח ולכן היא לא מסומנת אף פעם, ורק תופחת ברשימה. היא נשארת בלו"ז
   ומקבלת את תיוג "תזכורות"; מי שרוצה לראות אותה מדליק את התיוג. */
function isRepeatItem(it){ return !!(it && it.details && it.details.repeat); }
/* התגיות של פריט = תגיות מפורשות + הקטגוריה הישנה שלו, אם היא קטגוריה חכמה */
function allTagsOf(it){
  const t = tagsOf(it).slice();
  if (it.category && !PRIMARY_KEYS[it.category] && !t.includes(it.category)) t.unshift(it.category);
  if (isRepeatItem(it) && !t.includes(REMINDER_KEY)) t.unshift(REMINDER_KEY);
  return t;
}
const isSmartCat = (c) => !PRIMARY_KEYS[c.key];
/* סינון לפי מי אחראי — 'p:yair' / 'p:tamar'. memberOf מחזיר תצוגה בלבד,
   ולכן צריך פונקציה שמחזירה את המפתח עצמו */
const PEOPLE_FILTERS = [['p:tamar','tamar'], ['p:yair','yair']];
function memberKeyOf(k){
  if (MEMBERS[k]) return k;
  const nk = String(k||'').trim().toLowerCase();
  if (MEMBER_ALIASES[nk]) return MEMBER_ALIASES[nk];
  const hit = Object.keys(MEMBER_ALIASES).find(a => nk.indexOf(a + ' ') === 0);
  return hit ? MEMBER_ALIASES[hit] : 'app';
}
function matchesChip(it, chip){
  if (!chip) return true;
  if (chip.slice(0,2)==='p:') return memberKeyOf(responsibleOf(it)) === chip.slice(2);
  return allTagsOf(it).includes(chip);
}
/* כמה תיוגים דלוקים יחד = איחוד ("רפואה יחד עם חינוך"), אבל אדם ותגית
   מצטלבים: "תמר" + "רפואה" = המשימות הרפואיות של תמר, ולא שתי הרשימות זו לצד זו */
function matchesChips(it, chips){
  if (!chips || !chips.length) return true;
  const people = chips.filter(c => c.slice(0,2)==='p:');
  const tags   = chips.filter(c => c.slice(0,2)!=='p:');
  if (people.length){
    const k = memberKeyOf(responsibleOf(it));
    if (!people.some(c => c.slice(2)===k)) return false;
  }
  if (tags.length){
    const t = allTagsOf(it);
    if (!tags.some(x => t.includes(x))) return false;
  }
  return true;
}

   התאריך העברי עצמו ממשיך להופיע לצד התאריך הלועזי בכותרת היום.
   הבוט מסנן אותם כבר בסנכרון; כאן זו רשת ביטחון לשורות שכבר במסד. */

function colorStyle(key){

  return {
    background: 'color-mix(in srgb, '+c.bg+' 17%, var(--surface))',
    borderColor: 'color-mix(in srgb, '+c.bg+' 40%, var(--line))',
  };
}

/* צבע הרקע של שורה: סטטוס גובר על צבע אישי, כי הוא נושא מידע —
   כתום רגוע = בעבודה, ירוק בהיר = הושלם. משימה פתוחה מציגה את הצבע שבחרת. */
const ST_TINT = { doing:'#e0913a', done:'#4e9a5b' };
function rowStyle(st, colorKey){
  const tint = ST_TINT[st];
  if (!tint) return colorStyle(colorKey);
  return {
    background: 'color-mix(in srgb, '+tint+' 16%, var(--surface))',
    borderColor: 'color-mix(in srgb, '+tint+' 45%, var(--line))',

}

/* סדר הלוח: לביצוע למעלה, אחר כך בעבודה, ומה שבוצע בתחתית */
const ST_RANK = { todo:0, doing:1, done:2 };

  const ar = ST_RANK[statusOf(a)], br = ST_RANK[statusOf(b)];
  if (ar!==br) return ar-br;

}

function isToday(d){ const n=new Date(); return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate(); }
function startOfToday(){ const n=new Date(); n.setHours(0,0,0,0); return n; }
function relDay(d){
  const diff = Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - startOfToday())/86400000);
  if(diff===0) return 'היום'; if(diff===1) return 'מחר'; if(diff===2) return 'מחרתיים';
  if(diff<0) return 'עבר'; return 'בעוד '+diff+' ימים';
}
function fmtTime(d){ return d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}); }
function fmtDate(d){ return d.toLocaleDateString('he-IL',{day:'numeric',month:'numeric'}); }
function timeAgo(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'עכשיו';
  const m=Math.floor(s/60); if(m<60) return 'לפני '+m+' דק׳';
  const h=Math.floor(m/60); if(h<24) return 'לפני '+h+' שע׳';
  return 'לפני '+Math.floor(h/24)+' ימים';
}
function hexA(hex, a){
  if(!hex || hex[0]!=='#') return 'rgba(140,140,140,'+a+')';
  let h = hex.slice(1);
  if(h.length===3) h = h.split('').map(x=>x+x).join('');
  const n = parseInt(h,16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}

/* ============ הקשה כפולה = עריכה ============
   dblclick לבדו לא אמין בכל דפדפני הנייד (ולפעמים נבלע ע"י מחוות המערכת),
   ולכן סופרים כאן הקשות בעצמנו — זמן + מרחק. עובד זהה בעכבר ובמגע. */
function useDoubleTap(fn){
  const last = useRef(0);
  const pos  = useRef({ x:0, y:0 });
  return useCallback((e) => {
    const t = Date.now();
    const near = Math.hypot(e.clientX - pos.current.x, e.clientY - pos.current.y) < 26;
    if (t - last.current < 330 && near){ last.current = 0; fn(); }
    else { last.current = t; pos.current = { x:e.clientX, y:e.clientY }; }
  }, [fn]);
}

/* מיקוד בשדה עריכה שנפתח מתוך לחיצה.
   מיקוד מיידי לא שורד: פעולת ברירת המחדל של אותה לחיצה רצה *אחרי* המטפל
   ומעבירה את הפוקוס חזרה, וה-blur שנוצר היה סוגר את העריכה באותו רגע.
   לכן מתמקדים בפריים הבא, ורק משם מתחילים להקשיב ל-blur. */
function useEditFocus(open, ref){
  const ready = useRef(false);
  useEffect(() => {
    ready.current = false;
    if (!open) return;
    const el = ref.current; if(!el) return;
    const id = requestAnimationFrame(() => {
      el.focus();
      if (el.setSelectionRange) el.setSelectionRange(el.value.length, el.value.length);
      ready.current = true;
    });
    return () => cancelAnimationFrame(id);
  }, [open]);
  return ready;
}

  const [draft, setDraft] = useState('');
  const editRef = useRef(null);

  const onTitleDown = useDoubleTap(startEdit);

  const commitEdit = () => {
    const v = draft.trim();
    setEditing(false);
    if (v && v !== it.title) onEditTitle(it, v);

  const titleRef = useRef(null);
  const [clamped, setClamped] = useState(false);
  /* מדידת גלישת טקסט כופה חישוב פריסה. כותרת קצרה לא יכולה לגלוש משתי שורות,
     אז מדלגים עליה — זה חוסך עשרות חישובים מיותרים בכל רינדור של הרשימה */
  const mayOverflow = it.title.length > 34 || it.title.indexOf('\n') !== -1;
  useLayoutEffect(() => {
    if (!mayOverflow){ setClamped(false); return; }
    const el = titleRef.current; if(!el) return;
    setClamped(el.scrollHeight - el.clientHeight > 2);
  }, [it.title, openTxt, mayOverflow]);
  const rowEl = useRef(null);
  const [popUp, setPopUp] = useState(false);
  const refCb = useCallback((el)=>{ rowEl.current = el; if(!floating && setCardEl) setCardEl(it.id, el); }, [it.id, floating, setCardEl]);
  /* שורה בתחתית המסך — פותחים את החלונית כלפי מעלה כדי שלא תיחתך */
  const openPop = (which) => {
    const el = rowEl.current;
    const room = el ? (window.innerHeight - el.getBoundingClientRect().bottom) : 999;
    setPopUp(room < 300);
    setTagOpen(which==='tag' ? (o=>!o) : false);
    setColorOpen(which==='color' ? (o=>!o) : false);
    setRepOpen(which==='repeat' ? (o=>!o) : false);

  const st = statusOf(it);
  const who = responsibleOf(it);
  const loc = getLocation(it.details);
  const due = it.due_at ? new Date(it.due_at) : null;
  /* קטגוריה ראשית = משימות/קניות בלבד; כל השאר מוצג כתגיות */
  const cat = catMap[primaryOf(it)] || { key:'task', label:'משימות', color:'#8b8d95', icon:IC.task };
  const itemTags = allTagsOf(it);

  const done = st==='done';
  const rem = remindOf(it);
  const rep = repeatOf(it);
  const whoName = memberOf(who).name;

  return (
    <article ref={refCb} className={'trow st-'+st+(done?' is-done':'')+((tagOpen||colorOpen||repOpen)?' pop':'')} data-cardid={floating?undefined:String(it.id)}
      style={rowStyle(st, colorOf(it))}

      <button className="tcheck no-drag" title={done?'החזר לפתוח':'סמן כבוצע'}
        onClick={()=>onStatus(it, done?'todo':'done')}>

      <div className="tmain">
        {editing ? (
          <textarea ref={editRef} className="tedit no-drag" value={draft} rows={2}
            onChange={e=>setDraft(e.target.value)} onBlur={()=>{ if(editReady.current) commitEdit(); }}
            onKeyDown={e=>{
              if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); commitEdit(); }
              if (e.key==='Escape'){ e.preventDefault(); setEditing(false); }
            }} />
        ) : (
          <div ref={titleRef} className={'ttitle no-drag'+(openTxt?' open':'')}
            title="הקשה כפולה לעריכה" onPointerDown={onTitleDown}
            onClick={()=>setOpenTxt(o=>!o)}>{it.title}</div>
        )}
        {!editing && (clamped || openTxt) && (
          <div className="tmore no-drag" onClick={()=>setOpenTxt(o=>!o)}>{openTxt ? 'הצג פחות' : 'הצג עוד'}</div>
        )}
        <div className="tmeta">
          <span className="tchip" style={{ background:hexA(cat.color,0.15), color:cat.color }}>
            <Icon path={cat.icon} size={12} /> {cat.label}
          </span>
          {due && (

              {rep && <span> · 🔁 {REPEAT_LABEL[rep]}</span>}

          {rem && (
            <span className={'tchip no-drag '+(rem.sent?'rem-sent':'rem')} title="לחיצה מבטלת את התזכורת"

            <span className="tchip no-drag" title="הפוך לתזכורת" onClick={()=>onRemind && onRemind(it, true)}>

      </div>

      <div className="tacts">
        {!floating && (st==='doing'
          ? <button className="ibtn doing on no-drag" title="החזר ללביצוע" onClick={()=>onStatus(it,'todo')}><Icon path={I.undo} size={15} /></button>
          : <button className="ibtn doing no-drag" title="העבר לבעבודה" onClick={()=>onStatus(it,'doing')}><Icon path={I.play} size={14} /></button>
        )}
        {!floating && (
          <button className={'ibtn tag no-drag'+(colorOpen?' on':'')} title="צבע" onClick={()=>openPop('color')}>
            <Icon path={I.palette} size={15} />

        )}
        {!floating && (
          <button className={'ibtn tag no-drag'+(tagOpen?' on':'')} title="תיוג" onClick={()=>openPop('tag')}>
            <Icon path={I.tag} size={15} />
          </button>
        )}
        {!floating && <button className="ibtn del no-drag" title="מחיקה" onClick={()=>onRemove(it)}><Icon path={I.trash} size={15} /></button>}
      </div>

      {colorOpen && !floating && (
        <React.Fragment>
          <div className="tagback no-drag" onClick={()=>setColorOpen(false)}></div>
          <div className={'colorpop no-drag'+(popUp?' up':'')} onClick={(e)=>e.stopPropagation()}>
            {COLORS.map(c => {
              const sel = c.key === colorOf(it);
              return (
                <button key={c.key} title={c.name}
                  className={'swatch'+(sel?' sel':'')+(c.bg?'':' none')}

        </React.Fragment>
      )}

      {repOpen && !floating && (
        <React.Fragment>
          <div className="tagback no-drag" onClick={()=>setRepOpen(false)}></div>
          <div className={'tagpop no-drag'+(popUp?' up':'')} onClick={(e)=>e.stopPropagation()}>
            <div className="h">כל כמה זמן לחזור?</div>
            {REPEATS.map(r => {
              const on = rep === r.key;
              return (
                <div key={r.key||'none'} className={'topt'+(on?' sel':'')}
