/* שם המוצר — הקשה כפולה פותחת עריכה במקום, בדיוק כמו בכותרת של משימה */
function GName({ it, onEdit }){
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState('');
  const ref = useRef(null);
  const start = useCallback(() => { if(onEdit){ setDraft(it.title); setEditing(true); } }, [onEdit, it.title]);
  const onDown = useDoubleTap(start);
  const ready = useEditFocus(editing, ref);
  const commit = () => { const v = draft.trim(); setEditing(false); if (v && v !== it.title) onEdit(it, v); };
  if (editing) return (
    <input ref={ref} className="gedit" value={draft} onChange={e=>setDraft(e.target.value)}
      onBlur={()=>{ if(ready.current) commit(); }}
      onKeyDown={e=>{ if(e.key==='Enter'){ e.preventDefault(); commit(); } if(e.key==='Escape'){ setEditing(false); } }} />
  );
  return <span className="gname" title="הקשה כפולה לעריכה" onPointerDown={onDown}>{it.title}</span>;
}

/* ============ רשימת קניות — מסודרת לפי מחלקות, עם כמות וגרירה ============
   שתי רשימות באותה לשונית: סופר (מחולק למחלקות לפי מסלול החנות) ו"אחר"
   (בגדים, אלקטרוניקה וכו'). מתג אחד למעלה מחליף ביניהן. */
function ShoppingList({ items, cat, list, onList, onToggle, onRemove, onQty, onReorder, onEditTitle, onMoveList }){
  const meta = listMeta(list);
  const mine = items.filter(i => listOf(i) === meta.key);
  const active = mine.filter(i => !i.done);
  const bought = mine.filter(i => i.done).sort((a,b)=> new Date(b.updated_at||b.created_at) - new Date(a.updated_at||a.created_at));
  const counts = {};
  SHOP_LISTS.forEach(l => { counts[l.key] = items.filter(i => !i.done && listOf(i)===l.key).length; });

  /* קיבוץ לפי מחלקה + מיון פנימי לפי sort */
  const ORDER = meta.order;
  const groups = {}; ORDER.forEach(k => groups[k] = []);
  active.forEach(i => { const d = deptOf(i); (groups[d] || groups[meta.fallback]).push(i); });
  ORDER.forEach(k => groups[k].sort((a,b)=>sortOf(a)-sortOf(b)));
  const activeDepts = ORDER.filter(k => groups[k].length>0);
  const DEPT_MAP = meta.map;   /* המחלקות של הרשימה הפעילה */

  /* ----- גרירה לסידור (pointer) ----- */
  const [drag, setDrag] = useState(null);   /* {id,w,title,qty} */
  const [drop, setDrop] = useState(null);   /* {dept,index,y} */
  const dragRef = useRef(null);
  const floatRef = useRef(null);
  const bodyRef = useRef(null);
  const itemRefs = useRef({});

  useLayoutEffect(() => {
    if (drag && floatRef.current && dragRef.current){
      const d = dragRef.current;
      floatRef.current.style.transform = 'translate('+(d.x0-d.offx)+'px,'+(d.y0-d.offy)+'px)';
    }
  }, [drag]);

  const computeDrop = (x,y) => {
    const body = bodyRef.current, d = dragRef.current; if(!body || !d) return null;
    const secs = Array.from(body.querySelectorAll('[data-dept]'));
    if (secs.length===0) return null;
    let dept = secs[secs.length-1].getAttribute('data-dept');
    for (const s of secs){ const r=s.getBoundingClientRect(); if (y < r.bottom){ dept = s.getAttribute('data-dept'); break; } }
    const sec = secs.find(s => s.getAttribute('data-dept')===dept);
    const bodyRect = body.getBoundingClientRect();
    const els = sec ? Array.from(sec.querySelectorAll('[data-gid]')).filter(el => el.getAttribute('data-gid')!==String(d.id)) : [];
    let index = els.length, yPos = 0;
    for (let i=0;i<els.length;i++){ const r=els[i].getBoundingClientRect(); if (y < r.top + r.height/2){ index=i; break; } }
    if (els.length===0){ const h = sec && sec.querySelector('.shop-sec-h'); yPos = h ? (h.getBoundingClientRect().bottom - bodyRect.top + 3) : 0; }
    else if (index>=els.length){ const r=els[els.length-1].getBoundingClientRect(); yPos = r.bottom - bodyRect.top + 3; }
    else { const r=els[index].getBoundingClientRect(); yPos = r.top - bodyRect.top - 4; }
    return { dept, index, y:yPos };
  };

  const onMove = (e) => {
    const d = dragRef.current; if(!d) return;
    if (floatRef.current) floatRef.current.style.transform = 'translate('+(e.clientX-d.offx)+'px,'+(e.clientY-d.offy)+'px)';
    const t = computeDrop(e.clientX, e.clientY);
    if (t){ d.t = t; setDrop(t); }
  };
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    document.body.style.userSelect='';
    const d = dragRef.current;
    if (d && d.t) finalize(d.id, d.t.dept, d.t.index);
    dragRef.current=null; setDrag(null); setDrop(null);
  };
  const finalize = (id, dept, index) => {
    const list = (groups[dept]||[]).filter(i => i.id!==id);
    let newSort;
    if (list.length===0) newSort = 0;
    else if (index<=0) newSort = sortOf(list[0]) - 1;
    else if (index>=list.length) newSort = sortOf(list[list.length-1]) + 1;
    else newSort = (sortOf(list[index-1]) + sortOf(list[index]))/2;
    onReorder(id, dept, newSort);
  };
  const beginDrag = (e, it) => {
    const el = itemRefs.current[it.id]; if(!el) return;
    const r = el.getBoundingClientRect();
    dragRef.current = { id:it.id, offx:e.clientX-r.left, offy:e.clientY-r.top, x0:e.clientX, y0:e.clientY, t:null };
    setDrag({ id:it.id, w:r.width, title:it.title, qty:qtyOf(it) });
    document.body.style.userSelect='none';
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  };
  const onGrip = (e, it) => {
    if (e.button!=null && e.button!==0) return;
    e.preventDefault();
    const sx=e.clientX, sy=e.clientY; let started=false;
    const pre = (ev) => { if(started) return;
      if (Math.hypot(ev.clientX-sx, ev.clientY-sy) > 5){ started=true;
        window.removeEventListener('pointermove', pre); window.removeEventListener('pointerup', preUp);
        beginDrag({ button:0, clientX:ev.clientX, clientY:ev.clientY }, it); } };
    const preUp = () => { window.removeEventListener('pointermove', pre); window.removeEventListener('pointerup', preUp); };
    window.addEventListener('pointermove', pre);
    window.addEventListener('pointerup', preUp);
  };

  const emptyAll = active.length===0 && bought.length===0;

  return (
    <div className="shop">
      <div className="shop-head">
        <span className="ic" style={{ width:30, height:30, background:hexA(cat.color,0.2), color:cat.color }}><Icon path={cat.icon} size={17} /></span>
        רשימת קניות
        <span className="n">{active.length} לקנייה</span>
      </div>
      {/* שתי הרשימות. הסופר ראשון — הוא זה שנפתח בתוך החנות */}
      <div className="shop-switch">
        {SHOP_LISTS.map(l => (
          <button key={l.key} className={'sw-b'+(l.key===meta.key?' on':'')} onClick={()=>onList(l.key)}>
            <span className="em">{l.em}</span>{l.label}
            {counts[l.key]>0 && <span className="c">{counts[l.key]}</span>}
          </button>
        ))}
      </div>
      <div className="shop-body" ref={bodyRef}>
        {emptyAll && (
          <div className="shop-empty">
            {meta.key==='super'
              ? <React.Fragment>רשימת הסופר ריקה 🛒<br/>הוסיפו מוצר מלמטה — הוא יסודר אוטומטית לפי מחלקות החנות.</React.Fragment>
              : <React.Fragment>אין כאן כלום 🏷️<br/>בגדים, אלקטרוניקה, ציוד לבית — כל מה שלא נקנה בסופר.</React.Fragment>}
          </div>
        )}
        {drop && <div className="shop-drop" style={{ top:drop.y }}></div>}

        {activeDepts.map(dk => { const dp = DEPT_MAP[dk]; return (
          <div className="shop-sec" data-dept={dk} key={dk}>
            <div className="shop-sec-h"><span className="dept-em">{dp.em}</span>{dp.label}<span className="c">{groups[dk].length}</span></div>
            {groups[dk].map(it => { const who = responsibleOf(it); const q = qtyOf(it); return (
              <div className={'gitem'+(drag && drag.id===it.id ? ' dragging':'')} data-gid={String(it.id)} key={it.id}
                ref={el => { if(el) itemRefs.current[it.id]=el; else delete itemRefs.current[it.id]; }}>
                <span className="ghandle" title="גרירה לסידור" onPointerDown={(e)=>onGrip(e, it)}><Icon path={I.grip} size={16} stroke={2.4} /></span>
                <span className="gbox" title="נקנה" onClick={()=>onToggle(it, true)}></span>
                {/* השם והכפתורים עטופים יחד: במחשב זו שורה אחת, ובנייד השם
                    מקבל שורה שלמה לעצמו והכפתורים יורדים מתחתיו. בלי זה
                    נשארו לשם 37 פיקסלים והמילה נשברה לאותיות בודדות. */}
                <div className="gmain">
                  <GName it={it} onEdit={onEditTitle} />
                  <div className="gctl">
                    {who!=='app' && <Avatar who={who} size={22} />}
                    <div className="qty">
                      <button className="qbtn" title="פחות" onClick={()=>onQty(it,-1)} disabled={q<=1}><Icon path={I.minus} size={15} stroke={2.6} /></button>
                      <span className="qn">{q}</span>
                      <button className="qbtn" title="עוד" onClick={()=>onQty(it,1)}><Icon path={I.plus} size={15} stroke={2.6} /></button>
                    </div>
                    {/* סיווג אוטומטי אף פעם לא מושלם — העברה בין הרשימות בלחיצה */}
                    <button className="ibtn" title={'העבר ל'+listMeta(meta.key==='super'?'other':'super').label}
                      onClick={()=>onMoveList(it, meta.key==='super'?'other':'super')}>
                      <Icon path={I.swap} size={15} />
                    </button>
                    <button className="ibtn del" title="מחיקה" onClick={()=>onRemove(it)}><Icon path={I.trash} size={15} /></button>
                  </div>
                </div>
              </div>
            ); })}
          </div>
        ); })}

        {bought.length>0 && <div className="shop-sep">נרכשו ({bought.length})</div>}
        {bought.map(it => (
          <div className="gitem bought" key={it.id}>
            <span className="gbox" title="החזר לרשימה" onClick={()=>onToggle(it, false)}><Icon path={I.check} size={14} stroke={3} /></span>
            <GName it={it} onEdit={onEditTitle} />
            {qtyOf(it)>1 && <span className="gqty">×{qtyOf(it)}</span>}
            <button className="ibtn del" title="מחיקה" onClick={()=>onRemove(it)}><Icon path={I.trash} size={15} /></button>
          </div>
        ))}
      </div>

      {drag && (
        <div className="shop-float" ref={floatRef} style={{ width:drag.w }}>
          <div className="gitem"><span className="gname">{drag.title}</span>{drag.qty>1 && <span className="gqty">×{drag.qty}</span>}</div>
        </div>
      )}
    </div>
  );
}

/* ============ תצוגת יומן ============
   אותה קומפוננטה בשני תפקידים:
   • מלאה (סינון "לו"ז" בלבד) — במחשב רשת שעות: שבוע/3 ימים/יום, וגם אג׳נדה.
     בטלפון אג׳נדה בלבד — רשת שבועית על מסך צר דורשת גלילה לצדדים.
   • compact — הלו"ז הרץ של היום שיושב לצד הלוח, במחשב ובנייד כאחד.
     בדיוק אותה רשת של יומן Google (רצועת "כל היום", עמודת שעות, קו העכשיו),
     רק ליום אחד ועם דפדוף בין הימים. */
const CAL_MODES = [
  { key:'week',   label:'שבוע',   days:7 },
  { key:'day3',   label:'3 ימים', days:3 },
  { key:'day',    label:'יום',    days:1 },
  { key:'agenda', label:'אג׳נדה', days:14 },
];
const CAL_MODE_KEYS = {}; CAL_MODES.forEach(m => { CAL_MODE_KEYS[m.key] = 1; });
const HOUR_START = 7, HOUR_END = 23, ROW_H = 34;
/* גוון לכל יומן. יאיר ותמר מקבלים בדיוק את צבעי האווטארים שלהם, כדי שאירוע
   ביומן והשם על משימה ידברו באותה שפה. תזכורות מהלוח אינן יומן — הן מקבלות
   ענבר, ואינן מושפעות מסינון היומנים. */
const OWNER_COLOR = {
  board:'var(--doing-dot)', family:'var(--brand-2)',
  yair:'#6d8fb8', tamar:'#c0879b', other:'#9a9488',
};

const dayStart = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const dayId = (d) => d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
/* תאריך עברי באותיות ולא בספרות ("כ״ה באב", לא "25 באב").
   Intl יודע לתת את שם החודש, אבל מתעלם מ-numberingSystem:'hebr' ומחזיר
   את היום כמספר — אז את הגימטריה עושים כאן. */
const HEB_ONES = ['','א','ב','ג','ד','ה','ו','ז','ח','ט'];
const HEB_TENS = ['','י','כ','ל'];
function hebNum(n){
  if (!(n > 0 && n <= 30)) return String(n || '');
  if (n === 15) return 'ט״ו';        /* לא י״ה */
  if (n === 16) return 'ט״ז';        /* לא י״ו */
  const s = HEB_TENS[Math.floor(n/10)] + HEB_ONES[n%10];
  return s.length === 1 ? s + '׳' : s.slice(0,-1) + '״' + s.slice(-1);
}
let hebFmt = null;
function hebDate(d){
  try{
    if (!hebFmt) hebFmt = new Intl.DateTimeFormat('he-IL-u-ca-hebrew', { day:'numeric', month:'long' });
    const parts = hebFmt.formatToParts(d);
    const day = parts.find(p => p.type==='day');
    const month = parts.find(p => p.type==='month');
    if (!day || !month) return '';
    const lit = parts.find(p => p.type==='literal');
    return hebNum(Number(day.value)) + (lit ? lit.value : ' ב') + month.value;
  }catch(e){ return ''; }
}

/* מאחד את שני המקורות לרשימה אחת: תזכורות מהלוח ואירועים מיומן Google */
function unifiedEvents(items, calEvents, hiddenEvents, owners, from, to){
  const hid = new Set(hiddenEvents || []);
  const show = new Set(owners && owners.length ? owners : []);
  const out = [];
  /* התזכורות מהלוח הן צ'יפ בפני עצמו ("תזכורות") וניתנות לכיבוי כמו יומן */
  const showBoard = show.has('board');
  for (const it of items){
    if (!showBoard) break;
    if (!it.due_at || it.done || hiddenFromSchedule(it)) continue;
    const when = new Date(it.due_at);
    if (isNaN(when.getTime())) continue;
    const rule = repeatOf(it);
    const rem = remindOf(it);
    const add = (t, i) => out.push({
      key:'t'+it.id+(i ? '@'+t.getTime() : ''), kind:'task', it, title:it.title, when:t,
      end:new Date(t.getTime()+45*60000), allDay:false, owner:'board',
      color:OWNER_COLOR.board, rem, repeat:rule, occurrence:i>0 });
    /* סדרה נפרשת על פני הטווח המוצג; פריט רגיל הוא מופע יחיד */
    if (rule && from && to){
      const list = occurrences(it.due_at, rule, from, to);
      list.forEach((t, i) => add(t, i));
      if (!list.length && when >= from && when <= to) add(when, 0);
    } else {
      add(when, 0);
    }
  }
  for (const e of (calEvents || [])){
    if (hid.has(e.id) || isNoiseCalendar(e)) continue;
    const owner = e.owner && OWNER_COLOR[e.owner] ? e.owner : 'other';
    if (!show.has(owner)) continue;
    const when = new Date(e.starts_at);
    if (isNaN(when.getTime())) continue;
    const end = e.ends_at ? new Date(e.ends_at) : new Date(when.getTime()+60*60000);
    out.push({ key:'c'+e.id, kind:'cal', ev:e, title:e.title, when, end,
      allDay:!!e.all_day, owner, color:OWNER_COLOR[owner], loc:e.location });
  }
  return out.sort((a,b) => a.when - b.when);
}

function CalendarView({ items, calEvents, calOwners, onCalOwner, hiddenEvents, onHideEvent, onHide, mobile, pin, mode, onMode }){
  const [offset, setOffset] = useState(0);
  /* pin = תצוגה קבועה לפאנל הצד ('day' ללשונית הלו"ז, 'agenda' ללשונית
     המשימות). בלעדיו זו התצוגה המלאה, ובמסך צר היא תמיד אג׳נדה. */
  const compact = !!pin;
  const effMode = pin || (mobile ? 'agenda' : (CAL_MODE_KEYS[mode] ? mode : 'week'));
  const setMode = (k) => { if (onMode) onMode(k); };

  const cfg = CAL_MODES.find(m => m.key===effMode) || CAL_MODES[0];

  /* תחילת הטווח: בשבוע — יום ראשון של אותו שבוע; אחרת מהיום.
     הטווח מחושב לפני האירועים, כי סדרה חוזרת נפרשת לפיו. */
  const from = useMemo(() => {
    const t = dayStart(new Date());
    if (effMode==='week'){ const s = addDays(t, -t.getDay()); return addDays(s, offset*7); }
    return addDays(t, offset*cfg.days);
  }, [effMode, offset, cfg.days]);

  const days = useMemo(() => {
    const n = effMode==='agenda' ? 14 : cfg.days;
    return Array.from({length:n}, (_,i) => addDays(from, i));
  }, [from, effMode, cfg.days]);

  const to = useMemo(() => addDays(days[days.length-1], 1), [days]);

  const evs = useMemo(() => unifiedEvents(items, calEvents, hiddenEvents, calOwners, from, to),
    [items, calEvents, hiddenEvents, calOwners, from, to]);
  /* אותה רשימה בלי סינון היומן — רק כדי לדעת כמה אירועים הסינון מסתיר.
     בלי זה יום שכל האירועים בו הם ביומן שכובה נראה פשוט ריק. */
  const evsAll = useMemo(() => unifiedEvents(items, calEvents, hiddenEvents, OWNER_KEYS, from, to),
    [items, calEvents, hiddenEvents, from, to]);

  const byDay = useMemo(() => {
    const m = {};
    days.forEach(d => { m[dayId(d)] = { all:[], timed:[] }; });
    for (const e of evs){
      const k = dayId(e.when);
      if (!m[k]) continue;
      (e.allDay ? m[k].all : m[k].timed).push(e);
    }
    return m;
  }, [evs, days]);

  const hiddenByOwner = useMemo(() => {
    if (calOwners.length === OWNER_KEYS.length) return 0;
    const keys = new Set(days.map(dayId));
    const count = (list) => list.filter(e => keys.has(dayId(e.when))).length;
    return Math.max(0, count(evsAll) - count(evs));
  }, [evs, evsAll, days, calOwners]);

  const rangeLabel = effMode==='agenda'
    ? days.length+' ימים קדימה'
    : (days.length===1
        ? fmtDow(from)+' '+fmtDate(from)
        : fmtDate(from)+' – '+fmtDate(days[days.length-1]));

  const hours = [];
  for (let h=HOUR_START; h<HOUR_END; h++) hours.push(h);
  const topOf = (d) => Math.max(0, ((d.getHours()*60+d.getMinutes()) - HOUR_START*60) / 60 * ROW_H);
  const now = new Date();

  /* בלו"ז הרץ הגובה קצוב — בלי גלילה לשעה הנוכחית הוא היה נפתח ב-07:00
     ומראה שעות ריקות בדיוק כשמעניין מה קורה עכשיו */
  const scRef = useRef(null);
  useEffect(() => {
    if (effMode!=='day' || !scRef.current) return;
    const n = new Date();
    scRef.current.scrollTop = Math.max(0,
      ((n.getHours()*60 + n.getMinutes()) - HOUR_START*60) / 60 * ROW_H - 74);
  }, [effMode, offset]);

  const removeOf = (e) => e.kind==='cal' ? onHideEvent(e.ev) : onHide(e.it);
  const heading = pin==='day' ? 'לו"ז היום' : pin==='agenda' ? 'הימים הקרובים' : 'לו"ז ותזכורות';

  /* בתצוגה המלאה במחשב הכל יושב בשורת כלים אחת ולא בשלוש — הגובה שנחסך
     הוא בדיוק מה שהיה חסר כדי שכל הרשת תיכנס למסך בלי גלילה */
  const wide = !compact && !mobile;
  const modeBtns = CAL_MODES.map(m => (
    <button key={m.key} className={'cmb'+(effMode===m.key?' on':'')}
      onClick={()=>{ setMode(m.key); setOffset(0); }}>{m.label}</button>
  ));
  const ownerBtns = CAL_OWNERS.map(o => {
    const on = calOwners.includes(o.key);
    const c = OWNER_COLOR[o.key];
    return (
      <button key={o.key} className={'calf-b'+(on?' on':'')} onClick={()=>onCalOwner(o.key)}
        style={on ? { borderColor:c, background:'color-mix(in srgb, '+c+' 15%, var(--surface))',
                      color:'var(--text)' } : null}>
        <span className="csw" style={{ background:c, opacity:on?1:.4 }}></span>
        {o.label}
      </button>
    );
  });

  return (
    <div className={'panel calpanel'+(compact?' compact':'')}>
      <div className="panel-head">
        <span className="ph-ic"><Icon path={I.cal} size={17} /></span>
        {heading}
        {wide && <span className="hd-modes">{modeBtns}</span>}
        {wide && <span className="hd-cals">{ownerBtns}</span>}
        <span className="calnav">
          {effMode!=='agenda' && (
            <React.Fragment>
              <button className="cnb" title="קודם" onClick={()=>setOffset(o=>o-1)}>‹</button>
              <button className="cnb today" onClick={()=>setOffset(0)}>היום</button>
              <button className="cnb" title="הבא" onClick={()=>setOffset(o=>o+1)}>›</button>
            </React.Fragment>
          )}
          <span className="crng">{rangeLabel}</span>
        </span>
      </div>

      {/* בפאנל הצד ובנייד אין מקום לשורת כלים אחת — הן נשארות שורות נפרדות */}
      {!wide && <div className="calf">{ownerBtns}</div>}

      {effMode==='agenda' ? (
        <div className="agenda">
          {days.filter(d => { const g = byDay[dayId(d)]; return g && (g.all.length || g.timed.length); }).length===0
            ? <div className="side-empty">אין אירועים בטווח הזה.</div>
            : days.map(d => {
                const g = byDay[dayId(d)] || { all:[], timed:[] };
                const list = g.all.concat(g.timed);
                if (!list.length) return null;
                const isToday = dayId(d)===dayId(now);
                return (
                  <div className={'aday'+(isToday?' today':'')} key={dayId(d)}>
                    <div className="arail">
                      <div className="dow">{fmtDow(d)}</div>
                      <div className="num">{d.getDate()}</div>
                      <div className="heb">{hebDate(d)}</div>
                    </div>
                    <div className="arows">
                      {list.map(e => (
                        <div className="arow" key={e.key} style={{ '--own':e.color }}>
                          <div className="tm">{e.allDay ? 'כל היום' : fmtTime(e.when)}</div>
                          <div className="bd">
                            <div className="ti">{e.title}</div>
                            <div className="mt">
                              {e.kind==='cal'
                                ? <span className="mtag">{e.ev.calendar_label || 'יומן'}</span>
                                : e.occurrence
                                  ? <span className="mtag rem">🔁 {REPEAT_LABEL[e.repeat]}</span>
                                  : <span className={'mtag'+(e.rem?' rem':'')}>
                                      {e.rem ? (e.rem.sent ? 'התזכורת נשלחה' : 'תזכורת בוואטסאפ') : 'ללא תזכורת'}
                                    </span>}
                              {e.repeat && !e.occurrence && (
                                <span className="mtag">🔁 {REPEAT_LABEL[e.repeat]}</span>
                              )}
                              {e.loc && <span className="mtag">{e.loc}</span>}
                            </div>
                          </div>
                          <button className="ax" title='הסתר מהלו"ז' onClick={()=>removeOf(e)}>
                            <Icon path={I.x} size={13} />
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
        </div>
      ) : (
        <div className="weekscroll" ref={scRef}>
          <div className="week" style={{ gridTemplateColumns:'46px repeat('+days.length+',minmax(96px,1fr))' }}>
            <div className="wh corner"></div>
            {days.map(d => {
              const isToday = dayId(d)===dayId(now);
              return (
                <div className={'wh'+(isToday?' today':'')} key={dayId(d)}>
                  <div className="dow">{fmtDow(d)}</div>
                  <div className="num">{d.getDate()}</div>
                  <div className="heb">{hebDate(d)}</div>
                </div>
              );
            })}

            <div className="allday-lbl">כל היום</div>
            {days.map(d => {
              const g = byDay[dayId(d)] || { all:[] };
              return (
                <div className="allday-cell" key={'a'+dayId(d)}>
                  {g.all.map(e => (
                    <div className="wev chip" key={e.key} style={{ '--own':e.color }}
                      title={e.title} onDoubleClick={()=>removeOf(e)}>{e.title}</div>
                  ))}
                </div>
              );
            })}

            <div className="gutter">
              {hours.map(h => <div className="hr-lbl" key={h}>{String(h).padStart(2,'0')}:00</div>)}
            </div>
            {days.map(d => {
              const g = byDay[dayId(d)] || { timed:[] };
              const isToday = dayId(d)===dayId(now);
              const wknd = d.getDay()===5 || d.getDay()===6;
              return (
                <div className={'daycol'+(wknd?' weekend':'')} key={'c'+dayId(d)}>
                  {hours.map(h => <div className="hr-line" key={h}></div>)}
                  {isToday && now.getHours()>=HOUR_START && now.getHours()<HOUR_END && (
                    <div className="nowline" style={{ top:topOf(now) }}></div>
                  )}
                  {g.timed.map(e => {
                    const mins = Math.max(30, (e.end - e.when)/60000);
                    /* פחות מ-34px אין מקום לשתי שורות — עוברים לשורה אחת */
                    const px = Math.max(26, mins/60*ROW_H);
                    return (
                      <div className={'wev'+(px<34?' tiny':'')} key={e.key}
                        style={{ '--own':e.color, top:topOf(e.when), height:px }}
                        title={e.title} onDoubleClick={()=>removeOf(e)}>
                        <b>{e.title}</b><span>{fmtTime(e.when)}</span>

      {/* יום שכל האירועים בו שייכים ליומן אחר נראה פשוט ריק, ואי אפשר לנחש

/* ============ הגדרת החיבור לשורת ה-AI ============
   הטוקן נשמר במכשיר ולא בקובץ ה-HTML הציבורי — לכן הנקודה בשרת באמת
   סגורה, ולא רק מוסתרת. מזינים פעם אחת לכל מכשיר. */
function AISetup({ cfg, onClose, onSave }){
  const [url, setUrl] = useState(cfg.url || '');
  const [token, setToken] = useState(cfg.token || '');
  const [test, setTest] = useState('');
  const clean = url.trim().replace(/\/+$/, '');
  const check = async () => {
    setTest('בודק…');
    try{
      const r = await fetch(clean + '/api/compose', {
        method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token.trim() },
        body: JSON.stringify({ text:'' }),
      });
      const j = await r.json().catch(()=>({}));
      if (r.status === 401) setTest('✖ הטוקן לא תקין');
      else if (r.status === 503) setTest('✖ APP_TOKEN לא מוגדר בשרת');
      else if (r.ok || r.status === 400) setTest('✔ החיבור עובד');
      else setTest('✖ ' + (j.message || 'שגיאה ' + r.status));
    }catch(e){ setTest('✖ אין קשר לכתובת הזו'); }
  };
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <Icon path={I.spark} size={19} /> שורת AI
          <button className="ibtn x" onClick={onClose}><Icon path={I.x} size={18} /></button>
        </div>
        <div className="modal-body">
          <p className="aihelp">
            הבקשות נשלחות לבוט שלכם, ושם יושב מפתח Gemini — הוא לא מגיע לדפדפן.
            הכתובת והטוקן נשמרים במכשיר הזה בלבד.
          </p>
          <label className="ailbl">כתובת הבוט</label>
          <input className="aiinp" value={url} onChange={e=>setUrl(e.target.value)}
            placeholder="https://xxx.up.railway.app" dir="ltr" />
          <label className="ailbl">טוקן (APP_TOKEN שהגדרתם ב-Railway)</label>
          <input className="aiinp" value={token} onChange={e=>setToken(e.target.value)}
            placeholder="מחרוזת סודית" dir="ltr" type="password" />
          {test && <div className={'aitest'+(test.startsWith('✔')?' ok':test.startsWith('✖')?' bad':'')}>{test}</div>}
          <div className="aibtns">
            <button className="cmb" onClick={check} disabled={!clean || !token.trim()}>בדיקת חיבור</button>
            <button className="cmb on" onClick={()=>onSave({ url:clean, token:token.trim() })}
              disabled={!clean || !token.trim()}>שמירה</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============ האפליקציה ============ */
function App(){
  const [items, setItems] = useState([]);
  const [activities, setActivities] = useState([]);
  const prefs0 = useRef(null); if (!prefs0.current) prefs0.current = loadPrefs();
  /* לשונית פעילה אחת: 'sched' | 'task' | 'grocery' */
  const [view, setView] = useState(prefs0.current.view);
  /* תיוגים דלוקים: 'p:yair' / 'p:tamar' / מפתח קטגוריה חכמה — גם כאן כמה יחד */
  const [chips, setChips] = useState(prefs0.current.chips);
  const [calMode, setCalMode] = useState(prefs0.current.calMode);
  const [text, setText] = useState('');
  const [cats, setCats] = useState(loadCats);
  /* לו"ז מיומן Google + תגיות שהבוט הוסיף אחרי אישור */
  const [calEvents, setCalEvents] = useState([]);
  const [extraTags, setExtraTags] = useState([]);
  const [calOwners, setCalOwners] = useState(prefs0.current.calOwners);
  const [shopList, setShopList] = useState(prefs0.current.shopList);
  /* שורת ה-AI: הגדרות החיבור, מצב עבודה, וספינר בזמן שהבוט חושב */
  const [ai, setAi] = useState(() => loadAI());
  const [aiOpen, setAiOpen] = useState(false);
  const [aiBusy, setAiBusy] = useState(false);
  const aiOn = ai.on && aiReady(ai);
  const [hiddenEvents, setHiddenEvents] = useState(loadHiddenEvents);
  const [cat, setCat] = useState(prefs0.current.view==='grocery' ? 'grocery' : 'task');
  /* תיוג שנבחר כבר בשלב ההוספה, ותדירות חזרה לתזכורת חדשה */
  const [newTags, setNewTags] = useState([]);
  const [tagPickOpen, setTagPickOpen] = useState(false);
  const [newTagName, setNewTagName] = useState('');
  const [repeat, setRepeat] = useState('');
  const [assignee, setAssignee] = useState('shared');
  const [due, setDue] = useState('');
  const [showDate, setShowDate] = useState(false);
  const [live, setLive] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [theme, setTheme] = useState(() => document.documentElement.getAttribute('data-theme') || 'light');
  const [editCats, setEditCats] = useState(false);
  const [, setTick] = useState(0);

  const itemsRef = useRef(items); useEffect(()=>{ itemsRef.current = items; }, [items]);
  const chipsRef = useRef(chips); useEffect(()=>{ chipsRef.current = chips; }, [chips]);
  /* כל שינוי במצב התצוגה נשמר מיד — כך שסגירה של הטאב לא מאבדת אותו */
  useEffect(() => { savePrefs({ view, chips, calMode, calOwners, shopList, calV:2 }); },
    [view, chips, calMode, calOwners, shopList]);
  /* מעקב אחרי רוחב המסך — קובע סדר תצוגה בנייד ומפעיל משיכה לרענון */
  const [mobile, setMobile] = useState(isMobileView);
  useEffect(() => {
    const mq = window.matchMedia('(max-width:900px)');
    const on = () => setMobile(mq.matches);
    mq.addEventListener('change', on);
    /* גם resize — סיבוב מסך או שינוי גודל חלון לא תמיד מגיעים כאירוע change */
    window.addEventListener('resize', on);
    return () => { mq.removeEventListener('change', on); window.removeEventListener('resize', on); };
  }, []);
  /* תגיות שהבוט הוסיף (shared_tags) מצטרפות לתגיות המקומיות, בלי לדרוס אותן */
  const allCats = useMemo(() => {
    const known = new Set(cats.map(c=>c.key));
    const extra = extraTags.filter(t => t && t.key && !known.has(t.key))
      .map(t => ({ key:t.key, label:t.label || t.key, color:t.color || '#7c8ba0', icon:t.icon || IC.tag }));
    return extra.length ? cats.concat(extra) : cats;
  }, [cats, extraTags]);
  const catMap = useMemo(() => { const m={}; allCats.forEach(c=>m[c.key]=c); return m; }, [allCats]);
  const allCatsRef = useRef(allCats); useEffect(()=>{ allCatsRef.current = allCats; }, [allCats]);

  /* '*' = הדלק את כולם (מגיע מהשורה "עוד N אירועים ביומנים כבויים").
     אחרת החלפת מצב ליומן בודד — אפשר להשאיר אפילו אפס דלוקים, ואז נשארות
     על המסך רק התזכורות מהלוח, שאינן מסוננות ממילא. */
  const pickCalOwner = useCallback((k) => {
    setCalOwners(prev => k==='*' ? OWNER_KEYS.slice()
      : (prev.includes(k) ? prev.filter(x=>x!==k) : OWNER_KEYS.filter(x => x===k || prev.includes(x))));
  }, []);
  const hideEvent = useCallback((ev) => {
    setHiddenEvents(prev => { const next = prev.concat([ev.id]); saveHiddenEvents(next); return next; });
  }, []);

  /* ----- תצוגה ----- */
  const applyTheme = (t) => { setTheme(t); document.documentElement.setAttribute('data-theme', t); try{ localStorage.setItem('hamal_theme', t); }catch(e){} };

  const pullRef = useRef(null);
  const [refreshing, setRefreshing] = useState(false);

  /* הודעת מערכת קצרה (כישלון שמירה וכו') — נעלמת לבד */
  const [notice, setNotice] = useState('');
  const noticeTimer = useRef(null);
  const notify = useCallback((t) => {
    setNotice(t);
    clearTimeout(noticeTimer.current);
    noticeTimer.current = setTimeout(() => setNotice(''), 5000);
  }, []);
  useEffect(() => () => clearTimeout(noticeTimer.current), []);

  /* ----- טעינה + realtime ----- */
  const load = useCallback(async () => {
    /* שלוש הבקשות יוצאות יחד ולא בזו אחר זו. הן אינן תלויות זו בזו,
       והשרשור עלה בשני סיבובי רשת מיותרים בכל פתיחה — מורגש בנייד.
       ה-then הוא מה שמשגר אותן: בונה השאילתה של supabase-js שולח רק
       כשמבקשים ממנו תוצאה, אז בלעדיו הן היו יוצאות שוב בטור.
       הלו"ז מגוגל והתגיות המשותפות יושבים בטבלאות נפרדות; אם עוד לא
       נוצרו, פשוט לא מציגים אותן — שאר הלוח ממשיך לעבוד כרגיל. */
    const safe = (q) => q.then(r => r, () => ({ data:null, error:true }));
    const pItems = safe(sb.from('items').select('*').order('created_at', { ascending:false }));
    const pCal = safe(sb.from('calendar_events').select('*')
      .gte('starts_at', startOfToday().toISOString())
      .order('starts_at', { ascending:true }).limit(80));
    const pTags = safe(sb.from('shared_tags').select('*'));

    const { data, error } = await pItems;
    if (!error) setItems(data || []);
    setLoaded(true);

    const { data:ce } = await pCal;
    if (ce) setCalEvents(ce);
    const { data:st } = await pTags;
    if (st && st.length) setExtraTags(st);
  }, []);

  /* ----- משיכה לרענון (נייד) -----
     חייב לבוא אחרי הגדרת load. המחוון מוזז ישירות דרך ה-DOM ולא דרך state,
     אחרת כל פיקסל של משיכה היה גורם לרינדור מחדש של כל הרשימה */
  useEffect(() => {
    if (!mobile) return;
    const THRESHOLD = 70, MAX = 110;
    let startY = 0, dist = 0, armed = false;
    const scroller = () => document.scrollingElement || document.documentElement;
    const paint = (d) => {
      const el = pullRef.current; if(!el) return;
      el.style.transform = 'translateY('+d+'px)';
      el.style.opacity = d > 8 ? String(Math.min(1, d/THRESHOLD)) : '0';
      el.classList.toggle('ready', d >= THRESHOLD);
    };
    const onStart = (e) => {
      if (e.touches.length !== 1 || scroller().scrollTop > 0 || document.body.classList.contains('dragging')) { armed=false; return; }
      startY = e.touches[0].clientY; dist = 0; armed = true;
    };
    const onMove = (e) => {
      if (!armed) return;
      const dy = e.touches[0].clientY - startY;
      if (dy <= 0 || scroller().scrollTop > 0){ if(dist){ dist=0; paint(0);} armed = dy > 0; return; }
      dist = Math.min(dy * 0.5, MAX);   /* התנגדות, כמו במערכת ההפעלה */
      paint(dist);
    };
    const onEnd = async () => {
      if (!armed) return;
      armed = false;
      const hit = dist >= THRESHOLD;
      dist = 0; paint(0);
      if (hit){ setRefreshing(true); try { await load(); } finally { setRefreshing(false); } }
    };
    window.addEventListener('touchstart', onStart, { passive:true });
    window.addEventListener('touchmove', onMove, { passive:true });
    window.addEventListener('touchend', onEnd);
    window.addEventListener('touchcancel', onEnd);
    return () => {
      window.removeEventListener('touchstart', onStart);
      window.removeEventListener('touchmove', onMove);
      window.removeEventListener('touchend', onEnd);
      window.removeEventListener('touchcancel', onEnd);
    };
  }, [mobile, load]);

  /* ----- realtime + התאוששות -----
     בנייד ה-websocket מת ברגע שהמסך נכבה או שעוברים לאפליקציה אחרת, וכשחוזרים
     הוא לא קם לבד: הערוץ נשאר "מנוי" מבחינת הקוד, הנורה נשארת ירוקה, ופשוט
     לא מגיעים עדכונים. לכן שלוש שכבות: ערוץ שיודע להיפתח מחדש, האזנה לחזרה
     למסך/לרשת, ורענון תקופתי כגיבוי — כך הלוח אף פעם לא מפגר ביותר מדקה
     גם אם ה-realtime שבור לגמרי. */
  useEffect(() => {
    let ch = null, dead = false;
    const onChange = (payload) => {
      const ev = payload.eventType;
      const row = (payload.new && Object.keys(payload.new).length) ? payload.new : payload.old;
      if (row) {
        let action = 'עדכון';
        if (ev === 'INSERT') action = 'הוספה';
        else if (ev === 'DELETE') action = 'מחיקה';
        else if (ev === 'UPDATE') action = row.done ? 'הושלם' : 'עדכון';
        const whoKey = (row.details && row.details.assignee) ? row.details.assignee
                       : (row.created_by && row.created_by!=='app' ? row.created_by : 'app');
        setActivities(prev => [{ id:String(row.id||'x')+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),
          who:whoKey, action, title:row.title||'', ts:Date.now() }, ...prev].slice(0,20));
      }
      load();
    };
    /* שם ערוץ ייחודי לכל חיבור — שרת Realtime דוחה הצטרפות חוזרת לערוץ
       ששמו כבר תפוס על אותו socket, וזה בדיוק המצב אחרי ניתוק */
    const open = () => {
      if (dead) return;
      ch = sb.channel('items-live-'+Math.random().toString(36).slice(2,8))
        .on('postgres_changes', { event:'*', schema:'public', table:'items' }, onChange)
        .subscribe(s => { setLive(s === 'SUBSCRIBED'); });
    };
    const joined = () => ch && ch.state === 'joined';
    const revive = () => {
      if (dead || document.visibilityState !== 'visible') return;
      load();                                   /* קודם כל הנתונים — זה מיידי */
      if (joined()) return;
      if (ch) { try{ sb.removeChannel(ch); }catch(e){} ch = null; }
      open();
    };
    load();
    open();
    document.addEventListener('visibilitychange', revive);
    window.addEventListener('online', revive);
    window.addEventListener('pageshow', revive);   /* חזרה מ-bfcache באייפון */
    const timer = setInterval(() => {
      setTick(t => t+1);
      if (document.visibilityState !== 'visible') return;
      if (joined()) return;
      revive();                                 /* גיבוי: סקר כל דקה כשאין ערוץ */
    }, 60000);
    return () => {
      dead = true;
      document.removeEventListener('visibilitychange', revive);
      window.removeEventListener('online', revive);
      window.removeEventListener('pageshow', revive);
      if (ch) sb.removeChannel(ch);
      clearInterval(timer);
    };
  }, [load]);

  /* ----- פעולות (אופטימיות — מיידיות על המסך) ----- */
  /* כל הפעולות על כרטיס חייבות זהות יציבה, אחרת React.memo לא תופס
     ו-21 שורות מתרנדרות מחדש על כל שינוי קטן — זה מה שהאט את הנייד */
  const patchLocal = useCallback((id, fn) => setItems(prev => prev.map(i => i.id===id ? fn(i) : i)), []);

  /* ----- שורת ה-AI -----
     שולחים את הטקסט כמו שהוא לבוט, והוא מחליט הכל: קנייה או משימה, לאיזו
     רשימה, למי, מתי לתזכר, ואפילו אירוע ליומן. השורות נכתבות ב-Supabase
     בצד השרת, וה-realtime מביא אותן לכאן לבד — אין צורך לרענן. */
  const askAI = async () => {
    const raw = text.trim(); if (!raw || aiBusy) return;
    setAiBusy(true);
    setText('');
    try{
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 45000);
      const res = await fetch(ai.url + '/api/compose', {
        method:'POST', signal:ctrl.signal,
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+ai.token },
        body: JSON.stringify({ text:raw, who: assignee === 'shared' ? '' : assignee }),
      });
      clearTimeout(timer);
      let out = {};
      try{ out = await res.json(); }catch(e){}
      if (!res.ok){
        setText(raw);
        notify(out.message || (res.status===401 ? 'הטוקן לא תקין — בדקו בהגדרות' : 'הבוט החזיר שגיאה ('+res.status+')'));
        return;
      }
      notify(out.message || 'נקלט');
      load();                    /* לא מחכים ל-realtime — התשובה מיידית */
    }catch(e){
      setText(raw);
      notify(e.name === 'AbortError' ? 'הבוט לא ענה בזמן — נסו שוב' : 'אין קשר לבוט. בדקו את הכתובת בהגדרות');
    }finally{
      setAiBusy(false);
    }
  };

  const add = async () => {
    const raw = text.trim(); if (!raw) return;
    const chosen = assignee === 'shared' ? 'app' : assignee;
    const minSort = itemsRef.current.reduce((m,i)=>Math.min(m, sortOf(i)), 0);
    let title = raw;
    const details = { sort: minSort - 1 };
    if (chosen !== 'app') details.assignee = chosen;
    if (newTags.length) details.tags = newTags.slice();
    if (cat === 'grocery'){
      const q = extractQty(raw); title = q.title || raw; details.qty = q.qty;
      /* הרשימה שהמשתמש בחר בבורר גוברת על הניחוש מהשם */
      details.list = shopList;
      details.dept = shopList === 'other' ? (classifyOther(title) || 'misc') : classifyDept(title);
    }
    const row = { category:cat, title, created_by:'app', details };
    /* תאריך שנקבע כאן חייב להפוך גם לתזכורת: לולאת התזכורות של הבוט קוראת
       את details.remind_at, ובלעדיו פריט מהאפליקציה לא היה מזכיר כלום */
    if (due){
      row.due_at = new Date(due).toISOString();
      details.remind_at = row.due_at;
      if (repeat) details.repeat = repeat;
    }
    setText(''); setDue(''); setShowDate(false); setNewTags([]); setRepeat(''); setTagPickOpen(false);
    const tempId = 'tmp-'+Date.now();
    const fresh = { id:tempId, ...row, done:false, created_at:new Date().toISOString() };
    /* סינון תיוגים ששרד מהפעם הקודמת (הוא נשמר בהעדפות) מסתיר פריט חדש
       שלא נושא את התג — נראה בדיוק כמו "ההוספה לא עבדה". מי שהרגע הוסיף
       פריט מצפה לראות אותו, ולכן הסינון נפתח מעצמו. */
    if (cat !== 'grocery' && chips.length && !matchesChips(fresh, chips)) setChips([]);
    setItems(prev => [fresh, ...prev]);
    const { error } = await sb.from('items').insert(row);
    /* כישלון שקט הוא הגרוע מכל: הפריט נראה על המסך, נעלם ברענון הבא, ואי
       אפשר לנחש למה. מחזירים את הטקסט לתיבה כדי שהניסוח לא ילך לאיבוד. */
    if (error) {
      console.error('add', error);
      setItems(prev => prev.filter(i => i.id !== tempId));
      setText(raw);
      notify('לא הצלחתי לשמור — בדקו חיבור לאינטרנט ונסו שוב');
    }
  };

  /* סימון "בוצע" על תזכורת חוזרת סוגר את *המופע הזה* בלבד ומקדם למופע הבא.
     קודם הוא סגר את כל הסדרה — והניקוי האוטומטי מחק אותה כעבור יומיים,
     כך שהתזכורת נעלמה בשקט בלי שאיש ידע. */
  const setStatus = useCallback(async (it, status) => {
    const rule = repeatOf(it);
    if (status==='done' && rule && it.due_at){
      const next = stepDate(new Date(it.due_at), rule);
      const now = Date.now();
      let d = next;
      for (let i=0; d && d.getTime() <= now && i < 400; i++) d = stepDate(d, rule);
      if (d){
        const iso = d.toISOString();
        const gap = it.details && it.details.remind_at
          ? Date.parse(it.due_at) - Date.parse(it.details.remind_at) : 0;
        const details = Object.assign({}, it.details, {
          status:'todo', reminded:false, reminded_extra:[],
          remind_at: gap > 0 ? new Date(d.getTime()-gap).toISOString() : iso,
        });
        patchLocal(it.id, i => ({ ...i, details, due_at:iso, done:false }));
        const { error } = await sb.from('items').update({ details, due_at:iso, done:false }).eq('id', it.id);
        if (error) { console.error('repeat advance', error); load(); }
        return;
      }
    }
    const details = Object.assign({}, it.details, { status });
    patchLocal(it.id, i => ({ ...i, details, done: status==='done' }));
    const { error } = await sb.from('items').update({ details, done: status==='done' }).eq('id', it.id);
    if (error) { console.error('status', error); load(); }
  }, [patchLocal, load]);

  const toggleBought = async (it, bought) => {
    patchLocal(it.id, i => ({ ...i, done: bought }));
    const { error } = await sb.from('items').update({ done: bought }).eq('id', it.id);
    if (error) { console.error('bought', error); load(); }
  };

  /* כמות מוצר בקניות (#6) */
  const setQty = async (it, delta) => {
    const next = Math.max(1, qtyOf(it) + delta);
    if (next === qtyOf(it)) return;
    const details = Object.assign({}, it.details, { qty: next });
    patchLocal(it.id, i => ({ ...i, details }));
    const { error } = await sb.from('items').update({ details }).eq('id', it.id);
    if (error) { console.error('qty', error); load(); }
  };

  /* גרירה לסידור מוצר בקניות — קובע מחלקה חדשה + מיקום (#2,#3) */
  const reorderGrocery = async (id, dept, sort) => {
    const it = itemsRef.current.find(i => i.id === id); if (!it) return;
    const details = Object.assign({}, it.details, { dept, sort });
    patchLocal(id, i => ({ ...i, details }));
    if (String(id).startsWith('tmp-')) return;
    const { error } = await sb.from('items').update({ details }).eq('id', id);
    if (error) { console.error('reorder grocery', error); load(); }
  };

  /* העברת מוצר בין רשימת הסופר לרשימה השנייה. הסיווג האוטומטי טועה
     לפעמים, וזו הדרך לתקן אותו בלחיצה — כולל בחירת מחלקה מתאימה ביעד. */
  const moveShopList = async (it, target) => {
    const dept = target === 'other'
      ? (classifyOther(it.title) || 'misc')
      : classifyDept(it.title);
    const details = Object.assign({}, it.details, { list:target, dept });
    patchLocal(it.id, i => ({ ...i, details }));
    setShopList(target);
    if (String(it.id).startsWith('tmp-')) return;
    const { error } = await sb.from('items').update({ details }).eq('id', it.id);
    if (error) { console.error('move list', error); load(); }
  };

  const toggleTag = useCallback(async (it, key) => {
    const cur = tagsOf(it);
    const on = allTagsOf(it).includes(key);
    const next = on ? cur.filter(k=>k!==key) : [...cur, key];
    const details = Object.assign({}, it.details, { tags: next });
    const patch = { details };
    /* פריט ישן שהקטגוריה שלו היא התגית הזו — הורדת התגית מחזירה אותו למשימה
       רגילה, אחרת הוא היה נשאר מתויג לנצח */
    if (on && it.category === key) patch.category = 'task';
    patchLocal(it.id, i => ({ ...i, ...patch }));
    const { error } = await sb.from('items').update(patch).eq('id', it.id);
    if (error) { console.error('tag', error); load(); }
  }, [patchLocal, load]);

  /* עריכה בהקשה כפולה — משימה או מוצר. במוצר גם המחלקה מחושבת מחדש,
     אחרת "חלב" ששונה ל"לחם" היה נשאר תקוע במדף המוצרים החלביים */
  const editTitle = useCallback(async (it, title) => {
    const patch = { title };
    if (it.category === 'grocery'){
      /* הרשימה שאליה הפריט משויך נשמרת — רק המחלקה בתוכה מחושבת מחדש */
      const lst = listOf(it);
      patch.details = Object.assign({}, it.details, {
        list: lst,
        dept: lst === 'other' ? (classifyOther(title) || 'misc') : classifyDept(title),
      });
    }
    patchLocal(it.id, i => ({ ...i, ...patch }));
    if (String(it.id).startsWith('tmp-')) return;
    const { error } = await sb.from('items').update(patch).eq('id', it.id);
    if (error) { console.error('edit title', error); load(); }
  }, [patchLocal, load]);

  /* תדירות חזרה. הבוט הוא שמזיז את המועד קדימה כשהתזכורת נשלחת, ולכן
     כאן רק נרשם הכלל — והפעלה של חזרה מוודאת שיש בכלל תזכורת פעילה */
  const setRepeatRule = useCallback(async (it, rule) => {
    const details = Object.assign({}, it.details, { repeat: rule || null });
    if (rule && !details.remind_at && it.due_at){ details.remind_at = it.due_at; details.reminded = false; }
    patchLocal(it.id, i => ({ ...i, details }));
    const { error } = await sb.from('items').update({ details }).eq('id', it.id);
    if (error) { console.error('repeat', error); load(); }
  }, [patchLocal, load]);

  const remove = useCallback(async (it) => {
    setItems(prev => prev.filter(i => i.id !== it.id));   /* מיידי */
    if (String(it.id).startsWith('tmp-')) return;
    const { error } = await sb.from('items').delete().eq('id', it.id);
    if (error) { console.error('delete', error); load(); }
  }, [load]);

  /* משימות וקניות הן סננים ראשיים ולא ניתנות למחיקה — תמיד מוחזרות לרשימה */
  const saveCategories = useCallback(async (next) => {
    /* "תזכורות" מוגן כמו משימות/קניות: בלעדיו אין שום דרך להגיע לתזכורות
       החוזרות שהוצאו מרשימת המשימות. */
    const keep = DEFAULT_CATS.filter(d => (PRIMARY_KEYS[d.key] || d.key===REMINDER_KEY)
      && !next.find(c=>c.key===d.key));
    const ord = orderCats(next.concat(keep));
    /* תגית שנמחקה חייבת להיעלם משלושה מקומות, אחרת היא חוזרת מעצמה:
       הרשימה המקומית, טבלת התגיות המשותפת (שממנה היא נטענת מחדש בכל
       פתיחה), והפריטים עצמם — פריט שנשאר מתויג בה מחזיר אותה למסילה. */
    const gone = allCatsRef.current
      .filter(c => isSmartCat(c) && !ord.find(x => x.key === c.key))
      .map(c => c.key);
    setCats(ord); saveCats(ord);
    setChips(prev => prev.filter(c => c.slice(0,2)==='p:' || ord.find(x=>x.key===c)));
    if (!gone.length) return;
    setExtraTags(prev => prev.filter(t => !gone.includes(t.key)));

    const hit = itemsRef.current.filter(it =>
      gone.some(k => tagsOf(it).includes(k) || it.category === k));
    /* מנקים קודם על המסך ואז בשרת — אותה גישה אופטימית כמו בשאר הפעולות */
    hit.forEach(it => {
      const patch = { details: Object.assign({}, it.details,
        { tags: tagsOf(it).filter(k => !gone.includes(k)) }) };
      if (gone.includes(it.category)) patch.category = 'task';
      patchLocal(it.id, i => ({ ...i, ...patch }));
    });
    try {
      await Promise.all(hit.map(it => {
        const patch = { details: Object.assign({}, it.details,
          { tags: tagsOf(it).filter(k => !gone.includes(k)) }) };
        if (gone.includes(it.category)) patch.category = 'task';
        return sb.from('items').update(patch).eq('id', it.id);
      }));
      await sb.from('shared_tags').delete().in('key', gone);
    } catch(e){ console.error('delete tags', e); load(); }
  }, [patchLocal, load]);

  /* תג חדש נוצר תוך כדי הוספת משימה. הוא נשמר גם ב-shared_tags, כדי שיופיע
     מיד גם אצל תמר ובטלפון — ולא רק בדפדפן שבו נוצר */
  const createTag = useCallback(async (label) => {
    const name = String(label||'').trim();
    if (!name) return '';
    const exists = allCatsRef.current.find(c => c.label === name || c.key === name);
    if (exists) return exists.key;
    const used = allCatsRef.current.map(c => c.color);
    const color = PALETTE.find(c => !used.includes(c)) || PALETTE[allCatsRef.current.length % PALETTE.length];
    const tag = { key:name, label:name, color, icon:IC.tag };
    setCats(prev => { const ord = orderCats(prev.concat([tag])); saveCats(ord); return ord; });
    try{ await sb.from('shared_tags').upsert({ key:name, label:name, color, icon:IC.tag, created_by:'app' }); }
    catch(e){ console.error('shared tag', e); }
    return name;
  }, []);

  /* ============ גרירה (pointer + FLIP) ============ */
  const listRefs = useRef({ list:null });
  const [drag, setDrag] = useState(null);          /* {id,w,h,offx,offy} */
  const [dropTarget, setDropTarget] = useState(null); /* {col,index} */
  const dragRef = useRef(null);
  const floatRef = useRef(null);
  const cardEls = useRef({});
  const prevRects = useRef({});

  const setCardEl = useCallback((id, el) => {
    if(el) cardEls.current[id]=el;
    else { delete cardEls.current[id]; delete prevRects.current[id]; }
  }, []);

  /* FLIP: מנפיש תזוזות של כרטיסים אחרים בצורה חלקה */
  useLayoutEffect(() => {
    const dragId = dragRef.current && dragRef.current.id;
    Object.keys(cardEls.current).forEach(id => {
      const el = cardEls.current[id]; if(!el) return;
      const nr = el.getBoundingClientRect();
      const pr = prevRects.current[id];
      if (pr && id !== String(dragId) && (Math.abs(pr.top-nr.top)>1 || Math.abs(pr.left-nr.left)>1)){
        const dx = pr.left-nr.left, dy = pr.top-nr.top;
        el.style.transition='none'; el.style.transform='translate('+dx+'px,'+dy+'px)';
        el.getBoundingClientRect();
        requestAnimationFrame(()=>{ el.classList.add('flip'); el.style.transform='';
          const clr=()=>{ el.classList.remove('flip'); el.style.transition=''; el.removeEventListener('transitionend',clr); };
          el.addEventListener('transitionend', clr); });
      }
      prevRects.current[id]=nr;
    });
  });

  /* מיקום התחלתי לכרטיס המרחף — למניעת הבהוב בפינה */
  useLayoutEffect(() => {
    if (drag && floatRef.current && dragRef.current){
      const d = dragRef.current;
      floatRef.current.style.transform = 'translate('+(d.x-d.offx)+'px,'+(d.y-d.offy)+'px)';
    }
  }, [drag]);

  const computeTarget = (x,y) => {
    /* רשימה אחת אנכית — הגרירה משנה סדר בלבד, לא סטטוס */
    const d = dragRef.current; const col = 'list';
    const listEl = listRefs.current.list; let index = 0; let yPos = 6;
    if (listEl){
      const listRect = listEl.getBoundingClientRect();
      const cards = Array.from(listEl.querySelectorAll('[data-cardid]')).filter(el => el.getAttribute('data-cardid') !== String(d.id));
      index = cards.length;
      for (let i=0;i<cards.length;i++){ const r=cards[i].getBoundingClientRect(); if (y < r.top + r.height/2){ index=i; break; } }
      if (cards.length===0) yPos = 6;
      else if (index>=cards.length){ const r=cards[cards.length-1].getBoundingClientRect(); yPos = r.bottom - listRect.top + 3; }
      else { const r=cards[index].getBoundingClientRect(); yPos = r.top - listRect.top - 5; }
    }
    return { col, index, y:yPos };
  };

  const onMove = (e) => {
    const d = dragRef.current; if(!d) return;
    d.x=e.clientX; d.y=e.clientY;
    if (floatRef.current) floatRef.current.style.transform = 'translate('+(e.clientX-d.offx)+'px,'+(e.clientY-d.offy)+'px)';
    const t = computeTarget(e.clientX, e.clientY);
    if (t.col!==d.col || t.index!==d.index || Math.abs((d.y0||0)-t.y)>2){
      d.col=t.col; d.index=t.index; d.y0=t.y; setDropTarget({ col:t.col, index:t.index, y:t.y }); }
  };
  /* חשוב: בנייד הדפדפן מבטל מצביע (pointercancel) בהרבה מצבים — שיחה נכנסת,
     תפריט מערכת, מחווה של המערכת. בלי להאזין לזה הגרירה נתקעת עם כרטיס מרחף. */
  const onUp = () => {
    const d = dragRef.current;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    document.body.style.userSelect='';
    document.body.classList.remove('dragging');
    if (d){ finalizeDrag(d.id, d.col, d.index); }
    dragRef.current=null; setDrag(null); setDropTarget(null);
  };

  const startDrag = (e, it) => {
    if (e.button!=null && e.button!==0) return;
    const cardEl = cardEls.current[it.id]; if(!cardEl) return;
    const r = cardEl.getBoundingClientRect();
    const col = 'list';
    dragRef.current = { id:it.id, w:r.width, h:r.height, offx:e.clientX-r.left, offy:e.clientY-r.top, x:e.clientX, y:e.clientY, col, index:0 };
    const t = computeTarget(e.clientX, e.clientY); dragRef.current.col=t.col; dragRef.current.index=t.index; dragRef.current.y0=t.y;
    setDrag({ id:it.id, w:r.width, h:r.height, offx:e.clientX-r.left, offy:e.clientY-r.top });
    setDropTarget({ col:t.col, index:t.index, y:t.y });
    document.body.style.userSelect='none';
    document.body.classList.add('dragging');   /* עוצר גלילת מגע בזמן גרירה */
    /* לחיצה ארוכה בנייד עלולה לסמן טקסט לפני שהגרירה מתחילה — מנקים */
    try{ const s = window.getSelection(); if (s && s.removeAllRanges) s.removeAllRanges(); }catch(e){}
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  };

  /* גרירה מכל מקום בשורה (כמו בפתקים).
     בעכבר: מתחיל אחרי תזוזה של 6px. במגע: לחיצה ארוכה של 350ms — כך שגלילה
     רגילה של הרשימה ממשיכה לעבוד, ורק החזקה במקום מתחילה גרירה. */
  const startDragRef = useRef(null); startDragRef.current = startDrag;

  /* פעולות ההחלקה — ב-ref כדי ש-onRowDown יישאר יציב ולא ירנדר מחדש את הרשימה */
  const swipeRef = useRef({});
  swipeRef.current.del = remove;
  swipeRef.current.next = (it) => {
    const st = statusOf(it);
    if (st==='todo') setStatus(it, 'doing');
    else if (st==='doing') setStatus(it, 'done');
  };

  /* מגע בשורה יכול להיות שלושה דברים שונים, וההכרעה נופלת לפי הכיוון:
       אנכי  -> גלילה רגילה של העמוד
       אופקי -> החלקה: ימינה = מחיקה, שמאלה = קידום סטטוס
       החזקה במקום 350ms -> גרירה לשינוי סדר
     בעכבר אין החלקה — שם תזוזה של 6px כבר מתחילה גרירה. */
  const SWIPE_GO = 64;
  const onRowDown = useCallback((e, it) => {
    if (e.button!=null && e.button!==0) return;
    if (e.target.closest && e.target.closest('.no-drag')) return;
    const touch = e.pointerType==='touch' || e.pointerType==='pen';
    if (!touch) e.preventDefault();
    const rowEl = e.currentTarget;
    const sx=e.clientX, sy=e.clientY;
    let started=false, timer=null, swiping=null, dx=0;

    const paint = () => {
      if (!rowEl) return;
      rowEl.style.transition = 'none';
      rowEl.style.transform = 'translateX(' + dx + 'px)';
      rowEl.classList.toggle('sw-del', dx > 12);
      rowEl.classList.toggle('sw-next', dx < -12);
      rowEl.classList.toggle('sw-go', Math.abs(dx) >= SWIPE_GO);
    };
    const unpaint = () => {
      if (!rowEl) return;
      rowEl.style.transition = '';
      rowEl.style.transform = '';
      rowEl.classList.remove('sw-del','sw-next','sw-go');
    };
    const cleanup = () => {
      clearTimeout(timer);
      window.removeEventListener('pointermove', pre);
      window.removeEventListener('pointerup', preUp);
      window.removeEventListener('pointercancel', preUp);
    };
    const begin = (x,y) => { if(started) return; started=true; cleanup(); startDragRef.current({ button:0, clientX:x, clientY:y }, it); };
    const pre = (ev) => {
      if (started) return;
      const ddx = ev.clientX-sx, ddy = ev.clientY-sy;
      const dist = Math.hypot(ddx, ddy);
      if (touch){
        if (swiping===null && dist > 12) swiping = Math.abs(ddx) > Math.abs(ddy) * 1.4;
        if (swiping){ clearTimeout(timer); dx = ddx; paint(); return; }
        if (dist > 10) cleanup();   /* זו גלילה — מבטלים */
      }
      else if (dist > 6) begin(ev.clientX, ev.clientY);
    };
    const preUp = () => {
      if (swiping){
        const go = Math.abs(dx) >= SWIPE_GO, right = dx > 0;
        unpaint();
        if (go){ right ? swipeRef.current.del(it) : swipeRef.current.next(it); }
      }
      cleanup();
    };
    window.addEventListener('pointermove', pre);
    window.addEventListener('pointerup', preUp);
    window.addEventListener('pointercancel', preUp);
    if (touch) timer = setTimeout(() => begin(sx, sy), 350);
  }, []);

  /* הפיכת משימה עם תאריך לתזכורת, וביטולה. הבוט קורא את details.remind_at
     ושולח בוואטסאפ כשמגיע הזמן — גם אם הפריט נוצר כאן במחשב. */
  const setRemind = useCallback(async (it, on) => {
    if (on && !it.due_at) return;
    /* ביטול תזכורת מבטל גם את המקדימות שהבוט קבע ("רבע שעה לפני") —
       אחרת הן היו ממשיכות להישלח אחרי שכיבו את התזכורת עצמה */
    const details = Object.assign({}, it.details,
      on ? { remind_at: it.due_at, reminded:false }
         : { remind_at: null, reminded:false, remind_extra: [], reminded_extra: [] });
    patchLocal(it.id, i => ({ ...i, details }));
    const { error } = await sb.from('items').update({ details }).eq('id', it.id);
    if (error) { console.error('remind', error); load(); }
  }, [patchLocal, load]);

  /* הסתרה מהלו"ז — הפריט נשאר בלוח עם התאריך שלו, רק לא מופיע בפאנל */
  const hideFromSchedule = useCallback(async (it) => {
    const details = Object.assign({}, it.details, { hide_sched:true });
    patchLocal(it.id, i => ({ ...i, details }));
    const { error } = await sb.from('items').update({ details }).eq('id', it.id);
    if (error) { console.error('hide_sched', error); load(); }
  }, [patchLocal, load]);

  const setColor = useCallback(async (it, key) => {
    const details = Object.assign({}, it.details, { color:key });
    patchLocal(it.id, i => ({ ...i, details }));
    const { error } = await sb.from('items').update({ details }).eq('id', it.id);
    if (error) { console.error('color', error); load(); }
  }, [patchLocal, load]);

  const finalizeDrag = (id, col, index) => {
    const all = itemsRef.current;
    const it = all.find(i => i.id===id); if(!it) return;
    /* אותה רשימה נראית שמוצגת על המסך, בלי הפריט הנגרר */
    const showRep = chipsRef.current.includes(REMINDER_KEY);
    const colList = all.filter(i => primaryOf(i)==='task' && i.id!==id
      && (showRep || !isRepeatItem(i)) && matchesChips(i, chipsRef.current))
      .sort(byListOrder);
    const before = colList[index-1], after = colList[index];
    let newSort;
    if (colList.length===0) newSort = 0;
    else if (index<=0) newSort = sortOf(colList[0]) - 1;
    else if (index>=colList.length) newSort = sortOf(colList[colList.length-1]) + 1;
    else newSort = (sortOf(before)+sortOf(after))/2;
    /* גרירה מסדרת מחדש בלבד — סימון "בוצע" נעשה דרך תיבת הסימון */
    const details = Object.assign({}, it.details, { sort:newSort });
    patchLocal(id, i => ({ ...i, details }));
    sb.from('items').update({ details }).eq('id', id).then(({error})=>{ if(error){ console.error('reorder', error); load(); } });
  };

  /* ============ נגזרות ============ */
  const isSched   = view==='sched';
  const isTasks   = view==='task';
  const isGrocery = view==='grocery';
  const activeCat = catMap[isGrocery ? 'grocery' : 'task'];

  /* משימות = כל מה שאינו קנייה, ואז סינון לפי התגיות/האנשים שנבחרו.
     תזכורות חוזרות מוסתרות כברירת מחדל — הן חיות בלו"ז, ומופיעות כאן רק
     כשמדליקים במפורש את תיוג "תזכורות". */
  const showRepeat = chips.includes(REMINDER_KEY);
  const boardItems = items.filter(i => primaryOf(i)==='task'
    && (showRepeat || !isRepeatItem(i)) && matchesChips(i, chips));
  /* רשימה אחת: פתוחות למעלה לפי הסדר, שבוצעו יורדות לתחתית */
  let taskList = boardItems.slice().sort(byListOrder);

  /* בזמן גרירה — הפריט הנגרר יוצא מהרשימה (מוצג כרחף); קו־הכנסה מסמן את היעד */
  if (drag){ taskList = taskList.filter(i => i.id!==drag.id); }

  const groceryItems = items.filter(i => i.category==='grocery');
  const draggedItem = drag ? items.find(i=>i.id===drag.id) : null;

  /* המונים סופרים בדיוק את מה שרואים — תזכורת חוזרת אינה משימה פתוחה */
  const openCount = items.filter(i => !i.done && primaryOf(i)==='task' && !isRepeatItem(i)).length;
  const doneToday = items.filter(i => i.done && isToday(new Date(i.updated_at || i.created_at))).length;
  const schedCount = items.filter(i => i.due_at && !i.done && !hiddenFromSchedule(i)
    && new Date(i.due_at) >= startOfToday()).length;
  const primaryCount = (k) => k==='grocery'
    ? items.filter(i => i.category==='grocery' && !i.done).length
    : k==='sched' ? schedCount
    : items.filter(i => primaryOf(i)==='task' && !isRepeatItem(i)).length;
  const chipCount = (c) => items.filter(i => primaryOf(i)==='task' && matchesChip(i, c)).length;
  const smartCats = allCats.filter(isSmartCat);

  const whoOptions = [['tamar','tamar'],['yair','yair'],['shared','app']];
  const cardProps = useMemo(
    () => ({ cats:allCats, catMap, onStatus:setStatus, onRemove:remove, onRowDown,
             onToggleTag:toggleTag, onColor:setColor, onRemind:setRemind,
             onRepeat:setRepeatRule, onEditTitle:editTitle, setCardEl }),
    [allCats, catMap, setStatus, remove, onRowDown, toggleTag, setColor, setRemind,
     setRepeatRule, editTitle, setCardEl],
  );

  /* לשוניות חוצץ — אחת בכל פעם.
     מעבר בין לשוניות היה מקפיץ את העמוד לראשו: הדפדפן מקצץ את הגלילה לגובה
     התוכן החדש, והלשוניות — שהיו נעוצות בראש המסך — "נופלות" חזרה מתחת
     לבאנר. לכן כל לשונית זוכרת איפה היינו בה, ולשונית שנפתחת בפעם הראשונה
     נפתחת בראש התוכן שלה אבל עם הלשוניות עדיין נעוצות למעלה. */
  const wantScroll = useRef(null);
  /* מעבר בין לשוניות לא מזיז את העמוד: שורת הלשוניות נשארת בדיוק במקום
     שבו היא על המסך, והתוכן שמתחתיה מתחלף. קודם כל לשונית זכרה את מיקום
     הגלילה שלה — אבל חזרה למיקום עמוק (או ללשונית קצרה, שבה הגלילה
     המקסימלית קטנה מהמבוקש) קפצה את המסך פתאום למעלה. */
  const pickView = (k) => {
    if (k === view) return;
    const hdr = document.querySelector('header');
    const pin = hdr ? hdr.offsetHeight : 0;
    const here = window.scrollY;
    /* במחשב הבאנר והלשוניות נעוצים ממילא, ולכן אין שום סיבה להזיז את
       העמוד — נשארים בדיוק איפה שהיינו. בנייד רק הלשוניות נעוצות, אז
       דואגים שהן יישארו במקומן על המסך. */
    wantScroll.current = mobile ? (here >= pin ? pin : here) : here;
    setView(k);
    setCat(k==='grocery' ? 'grocery' : 'task');
  };
  /* אחרי שהתוכן החדש כבר במקום ולפני הציור — אחרת רואים הבהוב */
  useLayoutEffect(() => {
    const y = wantScroll.current;
    if (y == null) return;
    wantScroll.current = null;
    const apply = () => {
      const max = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
      window.scrollTo(0, Math.min(y, max));
    };
    apply();
    /* התוכן החדש עשוי עוד לגדול (לו"ז שנטען, תמונה, רשימה ארוכה) ואז
       הגלילה שביקשנו נחתכה לגובה הישן — מיישמים שוב אחרי הפריים */
    requestAnimationFrame(apply);
  }, [view]);
  /* (הוסרה נעיצת־הפתיחה בלשונית הלו"ז: היא גללה את הבאנר החוצה כדי לפנות
     מקום לרשת השעות. מאז שהבאנר והלשוניות נעוצים במחשב היא רק הזיזה את
     העמוד בלי סיבה.) */
  const toggleChip = (k) => setChips(prev => prev.includes(k) ? prev.filter(x=>x!==k) : prev.concat([k]));
  const addNewTag = async () => {
    const key = await createTag(newTagName);
    if (!key) return;
    setNewTags(p => p.includes(key) ? p : p.concat([key]));
    setNewTagName('');
  };

  return (
    <React.Fragment>
      <div className={'pullr'+(refreshing?' spin':'')} ref={pullRef}>
        <Icon path={I.undo} size={17} stroke={2.4} />
      </div>
      {/* במחשב הבאנר והלשוניות נעוצים יחד לראש המסך, ולכן הם עטופים
          באלמנט אחד. בנייד ה-topbar רגיל והלשוניות בלבד נעוצות — שם אין
          מספיק גובה מסך כדי להקריב 160 פיקסלים קבועים ללוגו. */}
      <div className="topbar">
      <header>
        <div className="head-in">
          <div className="brand">
            <img className="logo-img" src={LOGO_MARK} alt="חמ״ל משפחתי" />
          </div>
          <span className="live"><span className={'dot'+(live?'':' off')}></span>{live?'בזמן אמת':'מתחבר…'}</span>
          <div className="head-right">
            <span className="stat"><b>{openCount}</b> פתוחות</span>
            <span className="stat"><b>{doneToday}</b> הושלמו היום</span>
            <div className="theme">
              {THEMES.map(t => (
                <button key={t.key} className={theme===t.key?'on':''} title={t.label}
                  onClick={()=>applyTheme(t.key)}><Icon path={I[t.icon]} size={16} /></button>
              ))}
            </div>
          </div>
        </div>
      </header>

      {/* לשוניות חוצץ — אחת פתוחה בכל רגע, מחוברת לתוכן שמתחתיה */}
      <div className="tabs">
        {PRIMARY.map(p => {
          const ic = p.key==='sched' ? I.cal : (catMap[p.key] ? catMap[p.key].icon : IC.task);
          const col = p.color;
          const on = view===p.key;
          return (
            <button key={p.key} className={'tab'+(on?' on':'')} onClick={()=>pickView(p.key)}
              style={{ '--acc':col }}>
              <span className="cico" style={{ color:col }}><Icon path={ic} size={20} /></span>
              {p.label} <span className="cnt">{primaryCount(p.key)}</span>
            </button>
          );
        })}
      </div>
      </div>

      <div className={'layout'+(isTasks?'':' is-wide')}>
        {/* לשונית המשימות בלבד: מסילת התיוגים בקצה הפנימי */}
        {isTasks && (
          <TagRail cats={smartCats} chips={chips} onToggle={toggleChip}
            onClear={()=>setChips([])} count={chipCount} onEdit={()=>setEditCats(true)} />
        )}

        <main>
          {isSched ? (
            /* בנייד: קודם הלו"ז הרץ של היום, ומתחתיו האג׳נדה של הימים הקרובים.
               במחשב נשארת התצוגה המלאה עם בורר שבוע/3 ימים/יום/אג׳נדה. */
            mobile ? (
              <div className="calstack">
                <CalendarView items={items} calEvents={calEvents} calOwners={calOwners}
                  onCalOwner={pickCalOwner} hiddenEvents={hiddenEvents} onHideEvent={hideEvent}
                  onHide={hideFromSchedule} mobile={mobile} pin="day" />
                <CalendarView items={items} calEvents={calEvents} calOwners={calOwners}
                  onCalOwner={pickCalOwner} hiddenEvents={hiddenEvents} onHideEvent={hideEvent}
                  onHide={hideFromSchedule} mobile={mobile} pin="agenda" />
              </div>
            ) : (
              <CalendarView items={items} calEvents={calEvents} calOwners={calOwners}
                onCalOwner={pickCalOwner} hiddenEvents={hiddenEvents} onHideEvent={hideEvent}
                onHide={hideFromSchedule} mobile={mobile} mode={calMode} onMode={setCalMode} />
            )
          ) : isGrocery ? (
            <ShoppingList items={groceryItems} cat={activeCat} list={shopList} onList={setShopList}
              onToggle={toggleBought} onRemove={remove} onQty={setQty} onReorder={reorderGrocery}
              onEditTitle={editTitle} onMoveList={moveShopList} />
          ) : (
            <div className="tasklist" ref={el => { listRefs.current.list = el; }}>
              {dropTarget && <div className="drop-line" style={{ top:dropTarget.y }}></div>}
              {taskList.map(it => <Card key={it.id} it={it} {...cardProps} />)}
              {loaded && boardItems.length===0 && (
                <div className="board-empty">אין כאן עדיין כלום — הוסיפו פריט ראשון מלמטה.</div>
              )}
            </div>
          )}
        </main>

        {/* לו"ז נפרד בתצורת אג׳נדה, לצד רשימת המשימות.
            בנייד לשונית המשימות היא משימות בלבד — הלו"ז יושב בלשונית שלו. */}
        {isTasks && !mobile && (
          <aside className="side">
            <CalendarView items={items} calEvents={calEvents} calOwners={calOwners}
              onCalOwner={pickCalOwner} hiddenEvents={hiddenEvents} onHideEvent={hideEvent}
              onHide={hideFromSchedule} mobile={mobile} pin="agenda" />
          </aside>
        )}
      </div>

      {notice && (
        <div className="toast" onClick={()=>setNotice('')}>
          <Icon path={I.bell} size={15} /> {notice}
        </div>
      )}

      <div className={'addbar'+(aiOn?' ai':'')}>
        <div className="addbar-in">
          {/* מצב AI: שורה אחת בשפה חופשית. הבוט מחליט קנייה/משימה/לו"ז,
              ולכן כל הבוררים הידניים מיותרים כאן — נשאר רק "מי", שנחוץ
              לשיוך וליומן. */}
          <div className="add-opts">
            <button className={'aitog'+(aiOn?' on':'')}
              title={aiReady(ai) ? (aiOn ? 'מצב AI פעיל — לחצו למעבר להזנה ידנית' : 'הפעלת מצב AI') : 'הגדרת החיבור לבוט'}
              onClick={()=>{
                if (!aiReady(ai)) { setAiOpen(true); return; }
                const next = { ...ai, on: !ai.on };
                setAi(next); saveAI(next);
              }}>
              <Icon path={I.spark} size={15} />AI
            </button>
            {aiOn && (
              <button className="ai-gear" title="הגדרות החיבור" onClick={()=>setAiOpen(true)}>
                <Icon path={I.gear} size={15} />
              </button>
            )}
            {!aiOn && (
            <React.Fragment>
            {/* שלוש יעדים אמיתיים — התיוג נעשה על השורה עצמה.
                שתי רשימות הקניות מופיעות כאן ישירות, כדי שלא צריך להוסיף
                ואז להעביר */}
            <select value={cat==='grocery' ? 'grocery:'+shopList : 'task'}
              onChange={e=>{
                const v = e.target.value;
                if (v === 'task'){ setCat('task'); return; }
                setCat('grocery');
                setShopList(v.split(':')[1]);
              }}>
              <option value="task">משימות</option>
              <option value="grocery:super">קניות · סופר</option>
              <option value="grocery:other">קניות · אחר</option>
            </select>
            </React.Fragment>
            )}
            <div className="who-pick">
              {whoOptions.map(([val,mk]) => { const m = memberOf(mk); const shared = val==='shared';
                return (
                  <button key={val} className={'who'+(shared?' shared':'')+(assignee===val?' on':'')}
                    style={shared?null:{ background:m.color }} title={m.name} onClick={()=>setAssignee(val)}>
                    {shared ? <Icon path={I.users} size={15} stroke={2} /> : m.short}
                  </button>
                ); })}
            </div>
            {!aiOn && (
            <React.Fragment>
            {/* תיוג כבר בשלב ההוספה, כולל יצירת תג חדש שלא היה קיים */}
            <div className="addtag">
              <button className={'addtag-b'+(newTags.length?' on':'')} onClick={()=>setTagPickOpen(o=>!o)}>
                <Icon path={I.tag} size={15} />
                {newTags.length ? newTags.map(k => (catMap[k]||{label:k}).label).join(' · ') : 'תיוג'}
              </button>
              {tagPickOpen && (
                <React.Fragment>
                  <div className="tagback" onClick={()=>setTagPickOpen(false)}></div>
                  <div className="addpop" onClick={e=>e.stopPropagation()}>
                    {smartCats.map(c => { const on = newTags.includes(c.key);
                      return (
                        <div key={c.key} className={'topt'+(on?' sel':'')}
                          onClick={()=>setNewTags(p => on ? p.filter(x=>x!==c.key) : p.concat([c.key]))}>
                          <span className="box" style={on?{ background:c.color, borderColor:c.color }:null}>
                            {on && <Icon path={I.check} size={11} stroke={3} />}
                          </span>
                          <span className="tico" style={{ color:c.color }}><Icon path={c.icon} size={16} /></span>
                          <span>{c.label}</span>
                        </div>
                      ); })}
                    <div className="newtag">
                      <input value={newTagName} placeholder="תג חדש…" onChange={e=>setNewTagName(e.target.value)}
                        onKeyDown={e=>{ if(e.key==='Enter'){ e.preventDefault(); addNewTag(); } }} />
                      <button title="הוספת תג" disabled={!newTagName.trim()} onClick={addNewTag}>
                        <Icon path={I.plus} size={16} stroke={2.4} />
                      </button>
                    </div>
                  </div>
                </React.Fragment>
              )}
            </div>
            <button className={'date-toggle'+(showDate?' on':'')} onClick={()=>setShowDate(s=>!s)} title="תאריך/שעה"><Icon path={I.cal} size={17} /></button>
            </React.Fragment>
            )}
          </div>
          {!aiOn && showDate && (
            <div className="add-opts">
              <input type="datetime-local" value={due} onChange={e=>setDue(e.target.value)} style={{ flex:1, minWidth:0 }} />
              <select value={repeat} onChange={e=>setRepeat(e.target.value)} title="תדירות חזרה">
                {REPEATS.map(r => <option key={r.key||'none'} value={r.key}>{r.key ? '🔁 '+r.label : r.label}</option>)}
              </select>
            </div>
          )}
          <div className="add-main">
            <textarea value={text} onChange={e=>setText(e.target.value)} rows={1} disabled={aiBusy}
              onKeyDown={e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); (aiOn?askAI:add)(); } }}
              placeholder={aiOn
                ? (aiBusy ? 'חושב…' : 'כתבו בשפה חופשית — "תזכיר לי מחר ב-8 לקחת תרופה", "לקנות חלב ולחם"…')
                : (cat==='grocery' ? 'הוסף מוצר לרשימת הקניות…' : 'מה להוסיף לחמ״ל?  (Shift+Enter = שורה חדשה)')} />
            <button className={'add-btn'+(aiOn?' ai':'')+(aiBusy?' busy':'')}
              onClick={aiOn?askAI:add} disabled={aiBusy || !text.trim()} title={aiOn?'שליחה ל-AI':'הוספה'}>
              <Icon path={aiBusy ? I.undo : aiOn ? I.spark : I.plus} size={aiOn?20:22} stroke={2.2} />
            </button>
          </div>
        </div>
      </div>

      {aiOpen && <AISetup cfg={ai} onClose={()=>setAiOpen(false)}
        onSave={(v)=>{ const next={...v, on:true}; setAi(next); saveAI(next); setAiOpen(false); }} />}

      {drag && draggedItem && (
        <div className="drag-float" ref={floatRef} style={{ width:drag.w }}>
          <Card it={draggedItem} {...cardProps} floating />
        </div>
      )}

      {editCats && <CatEditor cats={smartCats} onSave={saveCategories} onClose={()=>setEditCats(false)} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  configured ? <App/> : <Setup/>
);
</script>

/* משימות וקניות תמיד ראשונות (מימין) — הכי שימושיות (#11) */
function orderCats(arr) {
  const pri = ['task', 'grocery'];
  const head = [];
  pri.forEach(k => {
    const c = arr.find(x => x.key === k);
    if (c) head.push(c);
  });
  const rest = arr.filter(c => !pri.includes(c.key));
  return [...head, ...rest];
}
const CATS_LS = 'hamal_cats_v1';
function loadCats() {
  try {
    const raw = localStorage.getItem(CATS_LS);
    if (raw) {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length) return orderCats(withReminderCat(arr.map(c => ({
        icon: IC.tag,
        ...c
      }))));
    }
  } catch (e) {}
  return orderCats(DEFAULT_CATS.map(c => ({
    ...c
  })));
}
/* מי שכבר השתמש בלוח שמר רשימת תגיות ישנה ב-localStorage, ולכן תוספת
   ל-DEFAULT_CATS לבדה לא הייתה מגיעה אליו לעולם. */
function withReminderCat(arr) {
  if (arr.find(c => c.key === REMINDER_KEY)) return arr;
  const def = DEFAULT_CATS.find(c => c.key === REMINDER_KEY);
  return arr.concat([{
    ...def
  }]);
}
function saveCats(cats) {
  try {
    localStorage.setItem(CATS_LS, JSON.stringify(cats));
  } catch (e) {}
}
function isMobileView() {

}

   כל אחד את המצב האחרון שלו. אין כאן זיהוי משתמש ואין תלות בקישור שדרכו
   נכנסו — פותחים את הלוח וממשיכים בדיוק מאיפה שעצרו. */

const VIEW_KEYS = {
  sched: 1,

const DEFAULT_PREFS = {
  view: 'task',

const SHOP_LIST_KEYS = {

function loadPrefs() {
  /* ברירת המחדל היא כל הצ'יפים דלוקים — בלי 'other', שאין לו צ'יפ */
  const allCals = () => CHIP_KEYS.slice();
  try {
    const raw = localStorage.getItem(PREFS_LS);
    if (raw) {
      const p = JSON.parse(raw) || {};
      /* גרסה קודמת שמרה מערך של תצוגות דלוקות; היום זו לשונית אחת */
      const legacy = Array.isArray(p.views) ? p.views.find(k => VIEW_KEYS[k]) : '';
      /* בורר היומן היה יומן אחד ("family"/"all"); היום זו בחירה מרובה,
         וברירת המחדל היא שכולם דלוקים */
      /* מעבר לגרסת הצ'יפים החדשה: 'אחר' יורד ו'תזכורות' נדלק. בלי הסימון
         הזה מכשיר קיים היה נטען עם התזכורות כבויות — הן פשוט לא היו
         קיימות במערך השמור. הסימון נשמר, כך שכיבוי מכוון אחר כך נשמר. */
      let cals = Array.isArray(p.calOwners) ? p.calOwners.filter(k => OWNER_KEYS.includes(k)) : allCals();
      if (p.calV !== 2) cals = cals.filter(k => k !== 'other').concat(['board']);
      return {
        view: VIEW_KEYS[p.view] ? p.view : legacy || DEFAULT_PREFS.view,
        chips: Array.isArray(p.chips) ? p.chips.filter(c => typeof c === 'string') : [],
        calMode: CAL_MODE_KEYS[p.calMode] ? p.calMode : 'week',
        calOwners: cals.length ? cals : allCals(),
        shopList: SHOP_LIST_KEYS[p.shopList] ? p.shopList : 'super',
        calV: 2
      };
    }
  } catch (e) {}
  return Object.assign({}, DEFAULT_PREFS, {
    chips: [],
    calOwners: allCals(),
    calV: 2
  });
